<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plazoid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#f3f5f8;--panel:#fff;--ink:#171b22;--muted:#6c7787;--line:#dfe4eb;--blue:#0aa7e8;--dark:#151b25;--studio:#0b111a;--studio2:#141c29}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Space Grotesk",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.screen{display:none;width:100%;height:100%}.screen.active{display:block}
nav{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 16px;z-index:10;position:relative}.logo{font-size:23px;font-weight:800;margin-right:12px}.navbtn{padding:10px 12px;border-radius:8px;background:transparent;color:#596474;font-weight:600}.navbtn:hover,.navbtn.active{background:#eef2f5;color:#111}.search{flex:1;max-width:450px;margin:auto}.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 14px;background:#f6f7f9}.balance{padding:9px 12px;border-radius:9px;background:#eaf9ff;color:#0780ad;font-weight:700}.avatarBtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7358e8,#00a8eb);color:white;font-weight:800}.wrap{height:calc(100% - 62px);overflow:auto;max-width:1500px;margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.6fr .4fr;gap:16px}.heroMain{min-height:245px;border-radius:16px;padding:30px;color:white;background:linear-gradient(125deg,#111925,#334f78);}.heroMain h1{font-size:42px;letter-spacing:-2px;margin:28px 0 6px}.heroMain p{max-width:650px;color:#d0d8e4}.creator{border:1px solid var(--line);background:white;border-radius:16px;padding:20px}.btn{border:0;padding:10px 14px;border-radius:8px;background:#e9edf2;font-weight:700}.blue{background:var(--blue);color:#fff}.dark{background:#182130;color:#fff}.section{margin-top:24px}.section h2{font-size:20px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.thumb{height:125px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,#3a526d,#172435)}.info{padding:12px}.info h3{margin:0 0 4px}.info p,.info small{color:var(--muted);font-size:12px}.play{width:100%;padding:9px;margin-top:10px;border-radius:8px;background:#eaf8fe;color:#087ca7;font-weight:700}.empty{padding:40px;text-align:center;border:1px dashed #c9d0d9;border-radius:12px;color:var(--muted);background:white}
.modal{position:fixed;z-index:100;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalBox{width:min(850px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.modalHead{display:flex;align-items:center;justify-content:space-between}.close{padding:8px 11px;border-radius:8px;background:#edf0f4}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.item{border:1px solid var(--line);border-radius:10px;padding:10px}.itemIcon{height:100px;background:#e9edf3;border-radius:8px;display:grid;place-items:center;font-size:42px}.buy{padding:8px 10px;background:var(--blue);color:#fff;border-radius:7px;font-weight:700}.toast{position:fixed;z-index:200;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#131b27;color:#fff;padding:10px 14px;border-radius:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
/* GAME */#game{background:#0a1018;position:relative;overflow:hidden}#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.gameHUD{position:absolute;inset:0;pointer-events:none}.gameHUD>*{pointer-events:auto}.gameTop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#121b29e8;color:#fff;border-radius:10px;padding:9px 12px}.gameBtns{display:flex;gap:7px}.round{width:42px;height:42px;border-radius:9px;background:#121b29e8;color:#fff}.levelBox{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#121b29e8;color:#fff;border-radius:10px;padding:8px 15px;font-weight:700}.mobileControls{position:absolute;inset:0;pointer-events:none}.joy{position:absolute;left:18px;bottom:20px;width:140px;height:140px;border-radius:50%;background:#ffffff0b;border:2px solid #ffffff1c;pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#ffffff26;transform:translate(-50%,-50%)}.jump{position:absolute;right:22px;bottom:28px;width:70px;height:70px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;pointer-events:auto}.gameHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff8;background:#101824aa;padding:7px 10px;border-radius:8px;font-size:12px}.sidePanel{display:none;position:absolute;right:12px;top:65px;width:min(350px,calc(100% - 24px));background:#111a27f5;color:white;border-radius:12px;padding:14px}.sidePanel.open{display:block}.chatLog{height:220px;overflow:auto;background:#080d14;border-radius:8px;padding:7px}.msg{padding:7px;border-bottom:1px solid #ffffff0d;font-size:13px}.chatRow{display:flex;gap:6px;margin-top:7px}.chatRow input{flex:1;padding:8px;border-radius:7px;border:1px solid #ffffff22;background:transparent;color:white}
/* STUDIO */#studio{background:var(--studio);color:#fff;position:relative}.studioBar{height:58px;background:var(--studio2);display:flex;align-items:center;gap:6px;padding:7px;overflow:auto}.studioBar button{white-space:nowrap;background:#202b3c;color:#dce5ef;padding:9px 11px;border-radius:8px}.studioBar button.active{background:#6558df;color:#fff}.studioLayout{height:calc(100% - 58px);display:grid;grid-template-columns:230px 1fr 270px}.studioPanel{background:#111925;padding:11px;overflow:auto}.leftPanel{border-right:1px solid #ffffff12}.rightPanel{border-left:1px solid #ffffff12}.studioViewport{position:relative;overflow:hidden}.studioViewport canvas{width:100%;height:100%;display:block;touch-action:none}.treeTitle{font-size:12px;color:#8592a6;margin:8px 0}.treeNode{padding:8px 9px;border-radius:7px;margin:2px 0;background:#192333;color:#dbe3ed;cursor:pointer;font-size:13px}.treeNode:hover,.treeNode.selected{background:#4f46a555}.treeNode.child{margin-left:17px;background:#151e2c}.prop{margin:10px 0}.prop label{font-size:11px;color:#8f9caf;display:block;margin-bottom:4px}.prop input,.prop textarea,.prop select{width:100%;padding:7px;border-radius:6px;border:1px solid #303c4f;background:#0c131d;color:white}.scriptEditor{height:210px;resize:vertical;font-family:monospace;font-size:12px}.studioMobile{display:none}.status{font-size:11px;color:#8d99aa}
@media(max-width:850px){nav{padding:0 8px}.navbtn{display:none}.search{max-width:none}.balance{display:none}.wrap{padding:12px}.hero{grid-template-columns:1fr}.creator{display:none}.heroMain h1{font-size:34px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:100px}.gameHint{display:none}.studioLayout{grid-template-columns:1fr}.leftPanel,.rightPanel{display:none}.studioMobile{display:flex;position:absolute;z-index:5;bottom:10px;left:8px;right:8px;justify-content:space-between;gap:5px}.studioMobile button{background:#161f2d;color:white;border-radius:8px;padding:10px}.studioBar .label{display:none}}
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.heroMain{padding:22px}.heroMain h1{font-size:29px}}
</style>
</head>
<body>
<section id="home" class="screen active">
<nav><div class="logo">PLAZOID</div><button class="navbtn active" onclick="Home.render()">Home</button><button class="navbtn" onclick="Home.discover()">Discover</button><button class="navbtn" onclick="Studio.open()">Studio</button><div class="search"><input placeholder="Search games and creators..." oninput="Home.search(this.value)"></div><div class="balance">∞ Plazs</div><button class="avatarBtn" onclick="UI.profile()">P</button></nav>
<div id="homeContent" class="wrap"></div></section>
<section id="game" class="screen"><canvas id="gameCanvas"></canvas><div class="gameHUD"><div class="gameTop"><div class="pill" id="gameTitle">Simple Obby</div><div class="gameBtns"><button class="round" onclick="Game.toggleChat()">☵</button><button class="round" onclick="Game.players()">☷</button><button class="round" onclick="Game.pause()">Ⅱ</button><button class="round" onclick="Game.leave()">×</button></div></div><div id="levelBox" class="levelBox">Level 1</div><div id="gameSide" class="sidePanel"></div><div class="mobileControls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button class="jump" onclick="Game.jump()">↑</button></div><div class="gameHint">WASD move · mouse drag camera · Space jump · controller supported</div></div></section>
<section id="studio" class="screen"><div class="studioBar"><button onclick="Studio.back()">←</button><b>PLAZOID STUDIO</b><button class="active" onclick="Studio.setTool('select')">Select</button><button onclick="Studio.setTool('move')">Move</button><button onclick="Studio.setTool('rotate')">Rotate</button><button onclick="Studio.setTool('scale')">Scale</button><button onclick="Studio.addBlock()">＋ Block</button><button onclick="Studio.addScript()">＋ Script</button><button onclick="Studio.addGui()">＋ GUI</button><button onclick="Studio.deleteSelected()">Delete</button><span style="flex:1"></span><button onclick="Studio.save()">Save</button><button onclick="Studio.test()">▶ Test</button><button onclick="Studio.publish()">Publish</button></div><div class="studioLayout"><aside class="studioPanel leftPanel"><b>EXPLORER</b><div class="treeTitle">GAME</div><div id="tree"></div><div class="treeTitle">PROJECT</div><button onclick="Studio.newProject()">New Project</button><p class="status" id="studioStatus"></p></aside><main id="studioViewport" class="studioViewport"></main><aside class="studioPanel rightPanel"><b>PROPERTIES</b><div id="properties"><p class="status">Select an object.</p></div></aside></div><div class="studioMobile"><button onclick="Studio.addBlock()">＋ Block</button><button onclick="Studio.setTool('move')">Move</button><button onclick="Studio.setTool('rotate')">Rotate</button><button onclick="Studio.setTool('scale')">Scale</button><button onclick="Studio.deleteSelected()">Delete</button></div></section>
<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button class="close" onclick="UI.close()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>
<script>
/* ==================== DATA / SAVE ==================== */
const STORE='plazoid_complete_v5';
const DEFAULT_OBBY=[
['Platform',[0,0,-93],[8,1,8],[0,0,0]],['Checkpoint3',[0,0,-117],[12,1,12],[0,0,0]],['Checkpoint2',[0,0,-58],[12,1,12],[0,0,0]],['Platform',[0,0,-34],[8,1,8],[0,0,0]],['Platform',[0,0,-45],[8,1,8],[0,0,0]],['Platform',[0,0,-12],[8,1,8],[0,0,0]],['Platform',[0,0,-23],[8,1,8],[0,0,0]],['Platform',[-7,0,-104],[8,1,8],[0,0,0]],['Spawnpoint',[0,0.5,0],[12,1,12],[0,0,0]],['Platform',[7,0,-82],[8,1,8],[0,0,0]],['Platform',[0,0,-71],[8,1,8],[0,0,0]]
];
const DB={data:{},load(){try{this.data=JSON.parse(localStorage.getItem(STORE))||{}}catch{this.data={}};if(!this.data.user)this.data.user={name:'Player_001',plazs:null,inventory:[],avatar:{skin:'#d79a72',shirt:'#5268e8',pants:'#303849',face:'🙂'}};if(!this.data.projects)this.data.projects=[];if(!this.data.settings)this.data.settings={graphics:'Medium',volume:1,music:1,sensitivity:.75,ui:1};if(!this.data.games)this.data.games=[{id:'simple-obby',name:'Simple Obby',creator:'Plazoid',description:'A simple checkpoint obstacle course.',emoji:'🏁',published:true,type:'obby'}];this.save()},save(){localStorage.setItem(STORE,JSON.stringify(this.data))}};DB.load();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),1600)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}

/* ==================== HOME / PLATFORM ==================== */
const Home={render(){show('home');this.draw(DB.data.games)},draw(games){document.getElementById('homeContent').innerHTML=`<div class="hero"><div class="heroMain"><b>PLAZOID DISCOVERY</b><h1>Play. Create. Publish.</h1><p>Discover games made by developers on Plazoid, or open Studio and build your own. This prototype keeps every project in its own saved state.</p><button class="btn blue" onclick="Home.discover()">Discover Games</button> <button class="btn" onclick="Studio.open()">Create Game</button></div><div class="creator"><div style="font-size:34px">▦</div><h2>Plazoid Studio</h2><p>Create worlds, objects, scripts and UI, then publish them to the platform.</p><button class="btn dark" onclick="Studio.open()">Open Studio</button></div></div><section class="section"><h2>Featured Games</h2><div class="cards">${games.map(this.card).join('')}</div></section>`},card(g){return `<article class="card"><div class="thumb">${g.emoji||'🎮'}</div><div class="info"><h3>${esc(g.name)}</h3><p>by ${esc(g.creator)}</p><small>${g.type==='obby'?'🏁 Checkpoint Obby':'🎮 Published game'}</small><button class="play" onclick="Game.launch('${g.id}')">Play</button></div></article>`},discover(){show('home');document.getElementById('homeContent').innerHTML=`<section class="section"><h2>Discover Games</h2><p style="color:var(--muted)">Only developer-published games appear here. No mystery filler games.</p><div class="cards">${DB.data.games.map(this.card).join('')}</div></section>`},search(q){q=q.trim().toLowerCase();if(!q)return this.render();this.draw(DB.data.games.filter(g=>(g.name+' '+g.creator).toLowerCase().includes(q)))}};
Home.render();

/* ==================== UI ==================== */
const UI={close(){document.getElementById('modal').classList.remove('open')},profile(){this.modal('Profile',`<h2>${esc(DB.data.user.name)}</h2><p>∞ Plazs</p><button class="btn blue" onclick="UI.avatar()">Avatar</button> <button class="btn" onclick="UI.shop()">Shop</button> <button class="btn" onclick="UI.settings()">Settings</button>`)},modal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('open')},avatar(){let a=DB.data.user.avatar;this.modal('Avatar',`<div class="field"><label>Skin Color</label><input type="color" value="${a.skin}" onchange="DB.data.user.avatar.skin=this.value;DB.save()"></div><div class="field"><label>Shirt</label><input type="color" value="${a.shirt}" onchange="DB.data.user.avatar.shirt=this.value;DB.save()"></div><div class="field"><label>Pants</label><input type="color" value="${a.pants}" onchange="DB.data.user.avatar.pants=this.value;DB.save()"></div><div class="field"><label>Face</label><select onchange="DB.data.user.avatar.face=this.value;DB.save()">${['🙂','😎','😐','😺','🤖'].map(x=>`<option ${x===a.face?'selected':''}>${x}</option>`).join('')}</select></div>`)},shop(){const items=[['neon','Neon Outfit','🟣'],['orbit','Orbit Suit','🪐'],['antenna','Signal Antenna','📡'],['vip','VIP Pass','★'],['double','Double Jump','↑↑']];this.modal('Plazoid Shop',`<div class="shopgrid">${items.map(i=>`<div class="item"><div class="itemIcon">${i[2]}</div><h3>${i[1]}</h3><p>Prototype item.</p><b>∞ Plazs</b><br><button class="buy" onclick="UI.buy('${i[0]}')">${DB.data.user.inventory.includes(i[0])?'Owned':'Buy'}</button></div>`).join('')}</div>`)},buy(id){if(!DB.data.user.inventory.includes(id))DB.data.user.inventory.push(id);DB.save();toast('Purchased and saved to inventory')},settings(){let s=DB.data.settings;this.modal('Settings',`<div class="field"><label>Graphics Quality</label><select id="quality"><option ${s.graphics==='Low'?'selected':''}>Low</option><option ${s.graphics==='Medium'?'selected':''}>Medium</option><option ${s.graphics==='High'?'selected':''}>High</option></select></div><div class="field"><label>Sound Volume</label><input id="volume" type="range" min="0" max="1" step=".05" value="${s.volume}"></div><div class="field"><label>Music Volume</label><input id="music" type="range" min="0" max="1" step=".05" value="${s.music}"></div><div class="field"><label>Camera Sensitivity</label><input id="sens" type="range" min=".2" max="2" step=".05" value="${s.sensitivity}"></div><div class="field"><label>UI Scale</label><input id="uis" type="range" min=".8" max="1.3" step=".05" value="${s.ui}"></div><button class="btn blue" onclick="UI.saveSettings()">Save Settings</button> <button class="btn" onclick="UI.fullscreen()">Toggle Fullscreen</button>`)},saveSettings(){let s=DB.data.settings;s.graphics=document.getElementById('quality').value;s.volume=+document.getElementById('volume').value;s.music=+document.getElementById('music').value;s.sensitivity=+document.getElementById('sens').value;s.ui=+document.getElementById('uis').value;document.body.style.fontSize=(16*s.ui)+'px';DB.save();toast('Settings saved')},fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}};

/* ==================== GAME / SIMPLE OBBY ==================== */
const Game={renderer:null,scene:null,camera:null,player:null,parts:[],keys:{},velY:0,onGround:false,run:false,yaw:0,pitch:-.25,camDist:7,last:0,checkpoint:-1,spawn:new THREE.Vector3(0,2,0),touch:{x:0,y:0},pad:null,drag:false,lastX:0,lastY:0,paused:false,current:null,launch(id){const g=DB.data.games.find(x=>x.id===id);if(!g)return;this.current=g;show('game');this.startObby()},startObby(){this.init();this.buildObby();this.resetPlayer();this.run=true;this.paused=false;this.last=performance.now();requestAnimationFrame(t=>this.loop(t))},init(){if(this.renderer)return;const c=document.getElementById('gameCanvas');this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x8ca9bf);this.scene.fog=new THREE.Fog(0x8ca9bf,80,190);this.camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,250);this.renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});this.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));this.renderer.setSize(innerWidth,innerHeight);this.scene.add(new THREE.HemisphereLight(0xffffff,0x415164,2));this.scene.add(new THREE.DirectionalLight(0xffffff,1.2));addEventListener('resize',()=>{if(this.camera){this.camera.aspect=innerWidth/innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight)}});addEventListener('keydown',e=>{this.keys[e.code]=true;if(e.code==='Space')this.jump()});addEventListener('keyup',e=>this.keys[e.code]=false);c.addEventListener('pointerdown',e=>{this.drag=true;this.lastX=e.clientX;this.lastY=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!this.drag)return;this.yaw-=(e.clientX-this.lastX)*.006*DB.data.settings.sensitivity;this.pitch-=(e.clientY-this.lastY)*.004*DB.data.settings.sensitivity;this.pitch=Math.max(-1.05,Math.min(.7,this.pitch));this.lastX=e.clientX;this.lastY=e.clientY});c.addEventListener('pointerup',()=>this.drag=false);this.setupJoystick();this.setupGamepad()},setupJoystick(){const joy=document.getElementById('joy'),stick=document.getElementById('stick');const move=e=>{const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);this.touch.x=Math.cos(a)*m/50;this.touch.y=Math.sin(a)*m/50;stick.style.transform=`translate(calc(-50% + ${this.touch.x*42}px),calc(-50% + ${this.touch.y*42}px))`};joy.onpointerdown=e=>{joy.setPointerCapture?.(e.pointerId);move(e)};joy.onpointermove=e=>move(e);joy.onpointerup=joy.onpointercancel=()=>{this.touch.x=this.touch.y=0;stick.style.transform='translate(-50%,-50%)'}},setupGamepad(){setInterval(()=>{const pads=navigator.getGamepads?.()||[];this.pad=[...pads].find(Boolean)},100)},buildObby(){this.parts.forEach(p=>this.scene.remove(p.mesh));this.parts=[];for(const row of DEFAULT_OBBY){const [name,pos,size,rot]=row;this.addPart(name,pos,size,rot)}this.updateLevel(-1)},addPart(name,pos,size,rot){const color=name.startsWith('Checkpoint')?'#39d98a':name==='Spawnpoint'?'#0aa7e8':'#687b93';const m=new THREE.Mesh(new THREE.BoxGeometry(size[0],size[1],size[2]),new THREE.MeshStandardMaterial({color}));m.position.set(...pos);m.rotation.set(...rot.map(x=>x*Math.PI/180));this.scene.add(m);this.parts.push({name,pos,size,rot,mesh:m});},resetPlayer(){if(this.player)this.scene.remove(this.player);const a=DB.data.user.avatar,g=new THREE.Group();const mat=c=>new THREE.MeshStandardMaterial({color:c});let body=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,.8),mat(a.shirt));body.position.y=1.7;let head=new THREE.Mesh(new THREE.SphereGeometry(.58,16,12),mat(a.skin));head.position.y=2.8;let l=new THREE.Mesh(new THREE.BoxGeometry(.45,1.2,.5),mat(a.pants)),r=l.clone();l.position.set(-.3,.6,0);r.position.set(.3,.6,0);g.add(body,head,l,r);g.position.copy(this.spawn);this.player=g;this.scene.add(g)},jump(){if(this.onGround&&!this.paused){this.velY=9;this.onGround=false}},collision(nextY){let grounded=false;for(const p of this.parts){const x=this.player.position.x,z=this.player.position.z,top=p.pos[1]+
