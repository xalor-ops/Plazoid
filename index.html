<section id="menu" class="screen on"><div class="menu"><div class="menuIn"><main><div class="bal"><span class="coin"></span>Plazs: ∞</div><div class="logo">PLAZOID</div><p class="sub">An original sandbox platform prototype. Build worlds, customize your character, collect things, chat with simulated players, and create games in Studio.</p><div class="buttons"><button class="btn" onclick="Game.start()">▶ Play<small>Enter the sandbox</small></button><button class="btn" onclick="UI.open('avatar')">◉ Avatar<small>Customize</small></button><button class="btn" onclick="UI.open('shop')">◆ Shop<small>Cosmetics & passes</small></button><button class="btn" onclick="Studio.open()">▦ Plazoid Studio<small>Create a project</small></button><button class="btn" onclick="UI.open('settings')">⚙ Settings<small>Graphics & controls</small></button><button class="btn" onclick="UI.open('profile')">● Profile<small>Local account</small></button></div></main><div class="hero"><div class="orb"></div><div class="cube"></div></div></div></div></section>

<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script><script>
'use strict';
const Store={key:'plazoid_v1',d:{avatar:{skin:'#d49a76',shirt:'#5968ef',pants:'#30384f',face:'🙂',hair:'Short',accessory:'None'},inventory:{avatars:['default'],clothing:[],accessories:[],gamepasses:[]},settings:{quality:'medium',sound:70,music:50,sensitivity:.8,ui:100},studio:[],plazs:null},load(){try{let x=JSON.parse(localStorage.getItem(this.key));if(x)this.d=Object.assign(this.d,x)}catch(e){}},save(){localStorage.setItem(this.key,JSON.stringify(this.d));toast('Saved locally')}};Store.load();
const Items=[['neon','avatars','Neon Runner','Luminous original avatar set',500,'🟣'],['orbit','avatars','Orbit Suit','Spacewear for imaginary gravity',800,'🪐'],['sunset','clothing','Sunset Jacket','Bright gradient jacket',150,'🧥'],['void','clothing','Void Trousers','Comfortably dark trousers',120,'👖'],['antenna','accessories','Signal Antenna','Beep responsibly',300,'📡'],['halo','accessories','Plaz Halo','Floating style',600,'💠'],['vip','gamepasses','VIP','VIP styling and badge',1500,'★'],['speed','gamepasses','Speed Boost','Run faster',1000,'⚡'],['double','gamepasses','Double Jump','Gain a second jump',1200,'↑↑'],['builder','gamepasses','Builder+','Extra building tools',2000,'▦'],['premium','gamepasses','Premium Avatar Pack','Cosmetic collection',2500,'✦']].map(x=>({id:x[0],category:x[1],name:x[2],desc:x[3],price:x[4],icon:x[5]}));
const UI={open(type,tab='avatars'){let m=document.getElementById('modal'),b=document.getElementById('body');m.classList.add('open');if(type==='shop')this.shop(b,tab);if(type==='avatar')this.avatar(b);if(type==='settings')this.settings(b);if(type==='profile')this.profile(b);if(type==='inventory')this.inventory(b)},close(){document.getElementById('modal').classList.remove('open')},toggle(id){let e=document.getElementById(id);e.classList.toggle('open');if(id==='chat')Chat.render();if(id==='players')Players.render()},shop(b,tab){document.getElementById('title').textContent='Plazoid Shop';let cats=['avatars','clothing','accessories','gamepasses'];b.innerHTML='<div class="tabs">'+cats.map(c=>`<button class="tab ${c===tab?'active':''}" onclick="UI.open('shop','${c}')">${c}</button>`).join('')+'</div><div class="cards">'+Items.filter(i=>i.category===tab).map(i=>{let own=Store.d.inventory[i.category].includes(i.id);return `<div class="item"><div class="preview">${i.icon}</div><h3>${i.name}</h3><p>${i.desc}</p><div class="row"><span class="price">${i.price} Plazs</span><span style="flex:1"></span><button class="smallbtn ${own?'secondary':'primary'}" onclick="Shop.buy('${i.id}')">${own?'Equip':'Buy'}</button></div></div>`}).join('')+'</div>'},avatar(b){document.getElementById('title').textContent='Avatar';let a=Store.d.avatar;b.innerHTML=`<div class="grid"><div class="preview" style="height:220px;font-size:75px">${a.face}</div><div><div class="field"><label>Skin</label><input type="color" value="${a.skin}" onchange="Avatar.set('skin',this.value)"></div><div class="field"><label>Shirt</label><input type="color" value="${a.shirt}" onchange="Avatar.set('shirt',this.value)"></div><div class="field"><label>Pants</label><input type="color" value="${a.pants}" onchange="Avatar.set('pants',this.value)"></div><div class="field"><label>Face</label><select onchange="Avatar.set('face',this.value)">${['🙂','😎','😐','😺','🤖'].map(x=>`<option ${x===a.face?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Hair</label><select onchange="Avatar.set('hair',this.value)">${['Short','Spikes','Long','None'].map(x=>`<option ${x===a.hair?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Accessory</label><select onchange="Avatar.set('accessory',this.value)">${['None','Antenna','Halo'].map(x=>`<option ${x===a.accessory?'selected':''}>${x}</option>`).join('')}</select></div></div></div>`},inventory(b){document.getElementById('title').textContent='Inventory';let a=[...Items.filter(i=>Store.d.inventory[i.category].includes(i.id)),{id:'default',name:'Default Avatar',category:'avatars',icon:'🙂',desc:'Starter avatar',price:0}];b.innerHTML='<div class="cards">'+a.map(i=>`<div class="item"><div class="preview">${i.icon}</div><h3>${i.name}</h3><p>${i.desc}</p><button class="smallbtn primary" onclick="Avatar.equip('${i.id}');UI.inventory(document.getElementById('body'))">Equip</button></div>`).join('')+'</div>'},settings(b){document.getElementById('title').textContent='Settings';let s=Store.d.settings;b.innerHTML=`<div class="field"><label>Graphics Quality</label><select onchange="Store.d.settings.quality=this.value;Store.save()"><option ${s.quality==='low'?'selected':''}>low</option><option ${s.quality==='medium'?'selected':''}>medium</option><option ${s.quality==='high'?'selected':''}>high</option></select></div><div class="field"><label>Sound Volume</label><input type="range" min="0" max="100" value="${s.sound}" oninput="Store.d.settings.sound=+this.value"></div><div class="field"><label>Music Volume</label><input type="range" min="0" max="100" value="${s.music}" oninput="Store.d.settings.music=+this.value"></div><div class="field"><label>Camera Sensitivity</label><input type="range" min=".2" max="2" step=".1" value="${s.sensitivity}" oninput="Store.d.settings.sensitivity=+this.value"></div><div class="field"><label>UI Scale</label><input type="range" min="80" max="125" value="${s.ui}" oninput="Store.d.settings.ui=+this.value"></div><button class="smallbtn primary" onclick="document.documentElement.requestFullscreen?.()">Fullscreen</button><button class="smallbtn secondary" onclick="Store.save()">Save</button>`},profile(b){document.getElementById('title').textContent='Profile';b.innerHTML='<div class="item"><h3>Player_001</h3><p>Local prototype account. No server identity exists yet.</p><div class="bal"><span class="coin"></span>∞ Plazs</div><br><button class="smallbtn primary" onclick="UI.open(\'inventory\')">Inventory</button></div>'}};
const Shop={buy(id){let i=Items.find(x=>x.id===id),a=Store.d.inventory[i.category];if(!a.includes(id))a.push(id);Store.save();Avatar.equip(id);toast(i.name+' purchased');UI.open('shop',i.category)}};
const Avatar={set(k,v){Store.d.avatar[k]=v;Store.save();Game.rebuild()},equip(id){if(id==='neon')Store.d.avatar.shirt='#37dff4';if(id==='orbit')Store.d.avatar.shirt='#d14cff';if(id==='sunset')Store.d.avatar.shirt='#ff795c';if(id==='void')Store.d.avatar.pants='#15151d';if(id==='antenna')Store.d.avatar.accessory='Antenna';if(id==='halo')Store.d.avatar.accessory='Halo';Store.save();Game.rebuild()}};
const Chat={msgs:[['Nova','Welcome to Plazoid!'],['Pixel','I found a shiny thing.']],render(){let p=document.getElementById('chat');p.innerHTML='<h2>Chat</h2><div class="chatlog">'+this.msgs.slice(-25).map(x=>`<div class="msg"><b>${esc(x[0])}</b><small>now</small><br>${esc(x[1])}</div>`).join('')+'</div><div class="chatline"><input id="chatInput" placeholder="Message..."><button class="smallbtn primary" onclick="Chat.send()">Send</button></div>'},send(){let i=document.getElementById('chatInput');if(!i.value.trim())return;this.msgs.push(['Player_001',i.value.trim()]);i.value='';this.render();setTimeout(()=>{let n=['Nova','Pixel','Zed','Luna'][Math.floor(Math.random()*4)],t=['nice build!','the studio is cool','I found more Plazs','testing...'][Math.floor(Math.random()*4)];this.msgs.push([n,t]);this.render()},700)}};
const Players={render(){document.getElementById('players').innerHTML='<h2>Players</h2>'+['Player_001','Nova','Pixel','Zed','Luna'].map((x,i)=>`<div class="pill" style="width:100%;margin:5px 0"><span>${['🙂','🟣','🟦','🟩','🟡'][i]}</span><b style="flex:1">${x}</b><span style="color:#55d6be">●</span></div>`).join('')}};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
