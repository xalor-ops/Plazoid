<script type="module">
import * as THREE from 'three';
const STORE='plazoid_complete_v1';
const state=JSON.parse(localStorage.getItem(STORE)||'null')||{user:{name:'Player_001',avatar:{skin:'#d79a72',shirt:'#5d68e8',pants:'#30384f',face:'🙂'},inventory:[],plazs:'Infinity'},projects:[],games:[]};
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
if(!state.games.length)state.games=[
{id:'sky',name:'Skyline Sprint',creator:'NovaDev',desc:'Race across a floating city.',emoji:'🏙️',players:12400,theme:0},
{id:'cave',name:'Cavebound',creator:'PixelWorks',desc:'Mine deeper and discover crystals.',emoji:'⛏️',players:8300,theme:1},
{id:'neon',name:'Neon Arena',creator:'ZedLabs',desc:'Fast arena battles.',emoji:'⚡',players:6700,theme:2},
{id:'rally',name:'Block Rally',creator:'LunaBuilds',desc:'Build and race.',emoji:'🏁',players:4100,theme:3},
{id:'cloud',name:'Cloud Isles',creator:'NovaDev',desc:'Explore floating islands.',emoji:'☁️',players:2900,theme:4}];save();
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=t=>{let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('on'),1500)};
const screen=x=>document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===x));
const modal=(t,b)=>{document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('on')};
const themes=['','t2','t3','t4','t5'];
const card=g=>`<article class="card"><div class="thumb ${themes[g.theme||0]}">${g.emoji||'🎮'}</div><div class="info"><h3>${esc(g.name)}</h3><div class="muted">by ${esc(g.creator)}</div><div class="muted">👥 ${(g.players||0).toLocaleString()} playing</div><button class="play" onclick="Game.launch('${g.id}')">Play</button></div></article>`;
window.Home={show(){screen('home');this.render()},render(){document.getElementById('homeContent').innerHTML=`<div class="hero"><div class="heroMain"><b>WELCOME TO PLAZOID</b><h1>Play. Create. Share.</h1><p>Discover games created by developers, or build your own world with Plazoid Studio.</p><button class="btn blue" onclick="Home.discover()">Discover Games</button> <button class="btn" onclick="Studio.open()">Create a Game</button></div><div class="creator"><div style="font-size:38px">▦</div><h2>Plazoid Studio</h2><p>Create a project, test it, then publish it to the game catalog.</p><button class="btn purple" onclick="Studio.open()">Open Studio</button></div></div><section class="sec"><div class="head"><h2>Continue Playing</h2></div><div class="cards">${state.games.slice(0,4).map(card).join('')}</div></section><section class="sec"><div class="head"><h2>Popular</h2></div><div class="cards">${[...state.games].sort((a,b)=>b.players-a.players).map(card).join('')}</div></section><section class="sec"><div class="head"><h2>Games Made By Developers</h2></div><div class="cards">${state.games.slice().reverse().map(card).join('')}</div></section>`},discover(){screen('home');document.getElementById('homeContent').innerHTML=`<section class="sec"><div class="head"><h2>Discover Games</h2><button class="btn" onclick="Home.show()">Home</button></div><div class="cards">${state.games.map(card).join('')}</div></section>`},search(q){q=q.toLowerCase();if(!q)return this.render();let a=state.games.filter(g=>(g.name+' '+g.creator).toLowerCase().includes(q));document.getElementById('homeContent').innerHTML=`<section class="sec"><h2>Search Results</h2><div class="cards">${a.map(card).join('')||'<p>No games found.</p>'}</div></section>`}};
window.UI={close(){document.getElementById('modal').classList.remove('on')},profile(){modal('Profile',`<h2>${esc(state.user.name)}</h2><p>∞ Plazs</p><button class="btn blue" onclick="UI.avatar()">Avatar</button> <button class="btn" onclick="UI.inventory()">Inventory</button> <button class="btn" onclick="UI.shop()">Shop</button>` )},avatar(){let a=state.user.avatar;modal('Avatar',`<div class="field"><label>Skin</label><input type="color" value="${a.skin}" onchange="state.user.avatar.skin=this.value;save();Game.rebuild()"></div><div class="field"><label>Shirt</label><input type="color" value="${a.shirt}" onchange="state.user.avatar.shirt=this.value;save();Game.rebuild()"></div><div class="field"><label>Pants</label><input type="color" value="${a.pants}" onchange="state.user.avatar.pants=this.value;save();Game.rebuild()"></div><div class="field"><label>Face</label><select onchange="state.user.avatar.face=this.value;save();Game.rebuild()">${['🙂','😎','😐','😺','🤖'].map(x=>`<option ${x===a.face?'selected':''}>${x}</option>`).join('')}</select></div>` )},inventory(){modal('Inventory',state.user.inventory.length?state.user.inventory.map(x=>`<div class="pill" style="color:#111;background:#f1f3f6;margin:5px">${esc(x)} <button class="btn" onclick="toast('Equipped ${esc(x)}')">Equip</button></div>`).join(''):'<p>Your inventory is empty. Visit the shop.</p>')},shop(){let items=[['neon','Neon Avatar','🟣'],['orbit','Orbit Suit','🪐'],['jacket','Sunset Jacket','🧥'],['void','Void Pants','👖'],['antenna','Signal Antenna','📡'],['halo','Plaz Halo','💠'],['vip','VIP Game Pass','★'],['speed','Speed Boost','⚡'],['double','Double Jump','↑↑'],['builder','Builder+','▦']];modal('Plazoid Shop',`<div class="shop">${items.map(i=>`<div class="item"><div class="ico">${i[2]}</div><h3>${i[1]}</h3><p class="muted">Test item. Purchases use Plazs.</p><b>∞ Plazs</b><br><button class="buy" onclick="UI.buy('${i[0]}')">Buy</button></div>`).join('')}</div>`)},buy(id){if(!state.user.inventory.includes(id))state.user.inventory.push(id);save();toast('Purchased: '+id);this.shop()}};
class GameSystem{constructor(){this.renderer=null;this.scene=null;this.camera=null;this.player=null;this.keys={};this.vel=0;this.active=false}launch(id){let g=state.games.find(x=>x.id===id);if(!g)return;this.current=g;screen('game');document.getElementById('gameTitle').textContent=g.name;this.init();this.build();this.active=true;this.loop()}init(){if(this.renderer)return;let c=document.getElementById('gameCanvas');this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x91aac0);this.camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);this.renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});this.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));this.renderer.setSize(innerWidth,innerHeight);this.scene.add(new THREE.HemisphereLight(0xffffff,0x45515f,2));addEventListener('resize',()=>{this.camera.aspect=innerWidth/innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{this.keys[e.code]=1;if(e.code==='Space')this.jump()});addEventListener('keyup',e=>this.keys[e.code]=0);let joy=document.getElementById('joy'),stick=document.getElementById('stick');joy.addEventListener('pointermove',e=>{if(!e.buttons)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;dx=Math.max(-42,Math.min(42,dx));dy=Math.max(-42,Math.min(42,dy));stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;this.keys.KeyW=dy<-12;this.keys.KeyS=dy>12;this.keys.KeyA=dx<-12;this.keys.KeyD=dx>12});joy.addEventListener('pointerup',()=>{this.keys={};stick.style.transform='translate(-50%,-50%)'});this.pad=()=>{for(const p of navigator.getGamepads?navigator.getGamepads():[])if(p){let x=p.axes[0]||0,y=p.axes[1]||0;this.keys.KeyA=x<-.2;this.keys.KeyD=x>.2;this.keys.KeyW=y<-.2;this.keys.KeyS=y>.2;if(p.buttons[0]?.pressed)this.jump()}}}build(){for(let i=this.scene.children.length-1;i>=1;i--)this.scene.remove(this.scene.children[i]);let ground=new THREE.Mesh(new THREE.BoxGeometry(80,1,80),new THREE.MeshStandardMaterial({color:0x52775c}));ground.position.y=-.5;this.scene.add(ground);for(let i=0;i<34;i++){let h=1+Math.random()*3,m=new THREE.Mesh(new THREE.BoxGeometry(2,h,2),new THREE.MeshStandardMaterial({color:[0x68758a,0x735d45,0x4f7c68][i%3]}));m.position.set((Math.random()-.5)*65,h/2,(Math.random()-.5)*65);this.scene.add(m)}this.rebuild()}rebuild(){if(this.player)this.scene.remove(this.player);let a=state.user.avatar,g=new THREE.Group(),M=c=>new THREE.MeshStandardMaterial({color:c});let body=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.5,.8),M(a.shirt));body.position.y=1.9;let head=new THREE.Mesh(new THREE.SphereGeometry(.63,16,12),M(a.skin));head.position.y=3.05;let l=new THREE.Mesh(new THREE.BoxGeometry(.48,1.25,.55),M(a.pants)),r=l.clone();l.position.set(-.3,.62,0);r.position.set(.3,.62,0);g.add(body,head,l,r);this.player=g;this.scene.add(g)}jump(){if(this.player?.position.y<=.02)this.vel=8}loop(){if(!this.active)return;requestAnimationFrame(()=>this.loop());this.pad();let dt=.016,d=new THREE.Vector3();if(this.keys.KeyW)d.z--;if(this.keys.KeyS)d.z++;if(this.keys.KeyA)d.x--;if(this.keys.KeyD)d.x++;if(d.length())d.normalize();this.player.position.addScaledVector(d,6*dt);this.vel-=22*dt;this.player.position.y+=this.vel*dt;if(this.player.position.y<0){this.player.position.y=0;this.vel=0}this.camera.position.set(this.player.position.x+7,this.player.position.y+4,this.player.position.z+7);this.camera.lookAt(this.player.position.x,this.player.position.y+1.5,this.player.position.z);this.renderer.render(this.scene,this.camera)}leave(){this.active=false;Home.show()}}const Game=new GameSystem();window.Game=Game;
window.Chat={open(){document.getElementById('side').classList.add('on');document.getElementById('side').innerHTML=`<h2>Chat</h2><div class="log" id="log"><div class="msg"><b>Nova</b>: Welcome!</div><div class="msg"><b>Pixel</b>: This world is cool.</div></div><div class="chatrow"><input id="chatInput" placeholder="Message"><button class="btn blue" onclick="Chat.send()">Send</button></div>`},send(){let i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;document.getElementById('log').innerHTML+=`<div class="msg"><b>Player_001</b>: ${esc(v)}</div>`;i.value='';setTimeout(()=>document.getElementById('log').innerHTML+=`<div class="msg"><b>${['Nova','Pixel','Zed','Luna'][Math.floor(Math.random()*4)]}</b>: nice!</div>`,600)}};window.Players={open(){document.getElementById('side').classList.add('on');document.getElementById('side').innerHTML='<h2>Players</h2>'+['Player_001','Nova','Pixel','Zed','Luna'].map(x=>`<div class="pill" style="margin:5px 0">● ${x}</div>`).join('')}};
class StudioSystem{constructor(){this.items=[];this.sel=null;this.project=null;this.scene=null;this.camera=null;this.renderer=null;this.toolName='select'}open(){screen('studio');setTimeout(()=>this.init(),10)}init(){if(this.renderer){this.refresh();return}let host=document.getElementById('studioCanvas');this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x0b1018);this.camera=new THREE.PerspectiveCamera(55,Math.max(1,host.clientWidth)/Math.max(1,host.clientHeight),.1,300);this.camera.position.set(9,8,12);this.camera.lookAt(0,0,0);this.renderer=new THREE.WebGLRenderer({antialias:true});this.renderer.setSize(host.clientWidth||500,host.clientHeight||500);host.appendChild(this.renderer.domElement);this.scene.add(new THREE.HemisphereLight(0xffffff,0x384252,2));this.scene.add(new THREE.GridHelper(60,60));this.project=state.projects[0]||this.newProject('My First Game');this.load(this.project);this.renderLoop()}newProject(name){let p={id:'p'+Date.now(),name,description:'A Plazoid game',published:false,objects:[]};state.projects.push(p);save();return p}load(p){this.project=p;this.items=[];while(this.scene.children.length>2)this.scene.remove(this.scene.children[2]);(p.objects||[]).forEach(o=>{let n={...o};this.items.push(n);this.mesh(n)});this.refresh()}mesh(o){let m=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:o.color||'#6573ff'}));m.position.set(o.x,o.y,o.z);m.rotation.set(o.rx||0,o.ry||0,o.rz||0);m.userData.id=o.id;o.mesh=m;this.scene.add(m)}add(){let o={id:'o'+Date.now(),name:'Block_'+(this.items.length+1),x:0,y:1,z:0,rx:0,ry:0,rz:0,color:'#6573ff'};this.items.push(o);this.mesh(o);this.sel=o;this.save();this.refresh()}del(){if(!this.sel)return;this.scene.remove(this.sel.mesh);this.items=this.items.filter(x=>x!==this.sel);this.sel=null;this.save();this.refresh()}tool(t){this.toolName=t;toast('Tool: '+t)}save(){this.project.objects=this.items.map(o=>{let{x,y,z,rx,ry,rz,color,name,id}=o;return{id,name,x,y,z,rx,ry,rz,color}});save();toast('Project saved')}publish(){this.save();let name=prompt('Game name',this.project.name);if(name)this.project.name=name;this.project.published=true;let g={id:'published_'+Date.now(),name:this.project.name,creator:state.user.name,desc:this.project.description,emoji:'🎮',players:0,theme:4,projectId:this.project.id,objects:this.project.objects};state.games.push(g);save();toast('Published! Now visible in Discover');Home.show()}test(){this.save();let g={id:'test',name:this.project.name,creator:state.user.name,emoji:'🛠️',players:0,theme:4};Game.current=g;screen('game');document.getElementById('gameTitle').textContent=g.name;Game.init();Game.build();Game.active=true;Game.loop()}select(o){this.sel=o;this.refresh()}back(){this.save();Home.show()}refresh(){document.getElementById('project').innerHTML=`<b>${esc(this.project.name)}</b><p class="muted">${this.project.published?'Published':'Draft'}</p><button class="tool" onclick="Studio.newProject(prompt('Project name','New Game')||'New Game')">New Project</button>`;document.getElementById('objects').innerHTML=this.items.map(o=>`<div class="obj ${o===this.sel?'sel':''}" onclick="Studio.select(Studio.items.find(x=>x.id==='${o.id}'))">${esc(o.name)}</div>`).join('');document.getElementById('props').innerHTML=this.sel?`<div class="field"><label>Name</label><input value="${esc(this.sel.name)}" oninput="Studio.sel.name=this.value;Studio.save()"></div><div class="field"><label>Color</label><input type="color" value="${this.sel.color}" onchange="Studio.sel.color=this.value;Studio.sel.mesh.material.color.set(this.value);Studio.save()"></div>${['x','y','z'].map(k=>`<div class="field"><label>Position ${k.toUpperCase()}</label><input type="number" value="${this.sel[k]}" onchange="Studio.sel[k]=+this.value;Studio.sel.mesh.position['${k}']=+this.value;Studio.save()"></div>`).join('')}`:'<p class="muted">Select an object.</p>'}renderLoop(){requestAnimationFrame(()=>this.renderLoop());if(this.renderer)this.renderer.render(this.scene,this.camera)}}const Studio=new StudioSystem();window.Studio=Studio;
Home.render();window.addEventListener('beforeunload',save);
</script></body></html>
