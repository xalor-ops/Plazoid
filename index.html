<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plazoid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap');
:root{--bg:#f3f5f8;--panel:#fff;--ink:#171b22;--muted:#6c7787;--line:#dfe4eb;--blue:#0aa7e8;--dark:#151b25;--studio:#0b111a;--studio2:#141c29;--green:#39d98a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"Space Grotesk",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.screen{display:none;width:100%;height:100%}
.screen.active{display:block}

nav{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 16px;z-index:10;position:relative}
.logo{font-size:23px;font-weight:800;margin-right:12px;letter-spacing:-1px}
.navbtn{padding:10px 12px;border-radius:8px;background:transparent;color:#596474;font-weight:600}
.navbtn:hover,.navbtn.active{background:#eef2f5;color:#111}
.search{flex:1;max-width:450px;margin:auto}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 14px;background:#f6f7f9}
.balance{padding:9px 12px;border-radius:9px;background:#eaf9ff;color:#0780ad;font-weight:700;white-space:nowrap}
.sessionCount{padding:9px 12px;border-radius:9px;background:#eef2f5;color:#596474;font-weight:600;white-space:nowrap;font-size:13px}
.sessionCount::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#39d98a;margin-right:6px}
.avatarBtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7358e8,#00a8eb);color:white;font-weight:800;flex-shrink:0}
.wrap{height:calc(100% - 62px);overflow:auto;max-width:1500px;margin:auto;padding:20px}
.hero{display:grid;grid-template-columns:1.6fr .4fr;gap:16px}
.heroMain{min-height:245px;border-radius:16px;padding:30px;color:white;background:linear-gradient(125deg,#111925,#334f78);position:relative;overflow:hidden}
.heroMain::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#0aa7e855,transparent 70%)}
.heroMain b{color:#7fd4ff;letter-spacing:1px;font-size:12px}
.heroMain h1{font-size:42px;letter-spacing:-2px;margin:10px 0 6px;position:relative}
.heroMain p{max-width:650px;color:#d0d8e4;position:relative}
.creator{border:1px solid var(--line);background:white;border-radius:16px;padding:20px}
.btn{border:0;padding:10px 14px;border-radius:8px;background:#e9edf2;font-weight:700;position:relative}
.blue{background:var(--blue);color:#fff}
.dark{background:#182130;color:#fff}
.section{margin-top:24px}
.section h2{font-size:20px}
.section .sub{color:var(--muted);font-size:13px;margin-top:-8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thumb{height:125px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,#3a526d,#172435)}
.info{padding:12px}
.info h3{margin:0 0 4px}
.info p,.info small{color:var(--muted);font-size:12px}
.play{width:100%;padding:9px;margin-top:10px;border-radius:8px;background:#eaf8fe;color:#087ca7;font-weight:700}
.empty{padding:40px;text-align:center;border:1px dashed #c9d0d9;border-radius:12px;color:var(--muted);background:white}

.modal{position:fixed;z-index:100;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.modalBox{width:min(850px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}
.modalHead{display:flex;align-items:center;justify-content:space-between}
.close{padding:8px 11px;border-radius:8px;background:#edf0f4}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white}
.sub{color:var(--muted);font-size:13px}
.sub a{color:var(--blue);text-decoration:none;font-weight:600}
.acctRow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;margin:4px 0;background:#f6f7f9;border:1px solid var(--line)}
.acctAvatarDot{width:26px;height:26px;border-radius:50%;flex-shrink:0}
.acctInfo{flex:1;color:var(--ink);font-size:13px;text-align:left}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px}
.itemIcon{height:100px;background:#e9edf3;border-radius:8px;display:grid;place-items:center;font-size:42px}
.buy{padding:8px 10px;background:var(--blue);color:#fff;border-radius:7px;font-weight:700}
.toast{position:fixed;z-index:200;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#131b27;color:#fff;padding:10px 14px;border-radius:9px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* GAME */
#game{background:#0a1018;position:relative;overflow:hidden}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.gameHUD{position:absolute;inset:0;pointer-events:none}
.gameHUD>*{pointer-events:auto}
.gameTop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.pill{background:#121b29e8;color:#fff;border-radius:10px;padding:9px 12px;font-weight:600}
.gameBtns{display:flex;gap:7px}
.round{width:42px;height:42px;border-radius:9px;background:#121b29e8;color:#fff;font-size:16px}
.levelBox{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#121b29e8;color:#fff;border-radius:10px;padding:8px 15px;font-weight:700;transition:transform .25s}
.levelBox.bump{transform:translateX(-50%) scale(1.12)}
.deathBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:#e8465388;color:#fff;padding:14px 22px;border-radius:12px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(4px)}
.deathBanner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mobileControls{position:absolute;inset:0;pointer-events:none}
.joy{position:absolute;left:18px;bottom:20px;width:140px;height:140px;border-radius:50%;background:#ffffff0b;border:2px solid #ffffff1c;pointer-events:auto;touch-action:none}
.stick{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#ffffff26;transform:translate(-50%,-50%)}
.jump{position:absolute;right:22px;bottom:28px;width:70px;height:70px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;pointer-events:auto;box-shadow:0 6px 18px #0aa7e855}
.gameHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff8;background:#101824aa;padding:7px 10px;border-radius:8px;font-size:12px}
.sidePanel{display:none;position:absolute;right:12px;top:65px;width:min(350px,calc(100% - 24px));background:#111a27f5;color:white;border-radius:12px;padding:14px}
.sidePanel.open{display:block}
.chatLog{height:220px;overflow:auto;background:#080d14;border-radius:8px;padding:7px}
.msg{padding:7px;border-bottom:1px solid #ffffff0d;font-size:13px}
.chatRow{display:flex;gap:6px;margin-top:7px}
.chatRow input{flex:1;padding:8px;border-radius:7px;border:1px solid #ffffff22;background:transparent;color:white}
.pauseOverlay{position:absolute;inset:0;background:#0a1018cc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(3px);padding:20px}
.pauseOverlay.open{display:flex}
.pauseOverlay h2{color:#fff;font-size:28px;margin:0}
.menuAccounts{width:min(360px,90vw);background:#0f1722cc;border-radius:12px;padding:12px;margin-top:6px}
.menuAccounts .acctRow{background:#111b28;border:1px solid #ffffff18}
.menuAccounts .acctInfo{color:#dbe3ed}
.menuAccounts .sub{color:#8d99aa}

/* STUDIO */
#studio{background:var(--studio);color:#fff;position:relative}
.studioBar{height:58px;background:var(--studio2);display:flex;align-items:center;gap:6px;padding:7px;overflow:auto}
.studioBar button{white-space:nowrap;background:#202b3c;color:#dce5ef;padding:9px 11px;border-radius:8px}
.studioBar button.active{background:#6558df;color:#fff}
.studioLayout{height:calc(100% - 58px);display:grid;grid-template-columns:230px 1fr 270px}
.studioPanel{background:#111925;padding:11px;overflow:auto}
.leftPanel{border-right:1px solid #ffffff12}
.rightPanel{border-left:1px solid #ffffff12}
.studioViewport{position:relative;overflow:hidden}
.studioViewport canvas{width:100%;height:100%;display:block;touch-action:none}
.treeTitle{font-size:12px;color:#8592a6;margin:8px 0}
.treeNode{padding:8px 9px;border-radius:7px;margin:2px 0;background:#192333;color:#dbe3ed;cursor:pointer;font-size:13px}
.treeNode:hover,.treeNode.selected{background:#4f46a555}
.treeNode.child{margin-left:17px;background:#151e2c}
.prop{margin:10px 0}
.prop label{font-size:11px;color:#8f9caf;display:block;margin-bottom:4px}
.prop input,.prop textarea,.prop select{width:100%;padding:7px;border-radius:6px;border:1px solid #303c4f;background:#0c131d;color:white}
.scriptEditor{height:210px;resize:vertical;font-family:monospace;font-size:12px}
.studioMobile{display:none}
.status{font-size:11px;color:#8d99aa}
.badge{display:inline-block;font-size:10px;background:#39d98a22;color:#39d98a;padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:700}

@media(max-width:850px){
  nav{padding:0 8px}
  .navbtn{display:none}
  .search{max-width:none}
  .balance{display:none}
  .sessionCount{display:none}
  .wrap{padding:12px}
  .hero{grid-template-columns:1fr}
  .creator{display:none}
  .heroMain h1{font-size:34px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .thumb{height:100px}
  .gameHint{display:none}
  .studioLayout{grid-template-columns:1fr}
  .leftPanel,.rightPanel{display:none}
  .studioMobile{display:flex;position:absolute;z-index:5;bottom:10px;left:8px;right:8px;justify-content:space-between;gap:5px}
  .studioMobile button{background:#161f2d;color:white;border-radius:8px;padding:10px}
  .studioBar .label{display:none}
}
@media(max-width:480px){
  .cards{grid-template-columns:1fr 1fr}
  .heroMain{padding:22px}
  .heroMain h1{font-size:29px}
}
</style>
</head>
<body>

<section id="home" class="screen active">
<nav>
  <div class="logo">PLAZOID</div>
  <button class="navbtn active" onclick="Home.render()">Home</button>
  <button class="navbtn" onclick="Home.discover()">Discover</button>
  <button class="navbtn" onclick="Studio.open()">Studio</button>
  <div class="search"><input placeholder="Search games and creators..." oninput="Home.search(this.value)"></div>
  <div class="sessionCount" id="sessionCount" title="Live count of people currently signed in and connected">● connecting…</div>
  <div class="balance">∞ Plazs</div>
  <button class="avatarBtn" id="navAuthBtn" onclick="AuthUI.open()">?</button>
</nav>
<div id="homeContent" class="wrap"></div>
</section>

<section id="game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div class="gameHUD">
    <div class="gameTop">
      <div class="pill" id="gameTitle">Simple Obby</div>
      <div class="gameBtns">
        <button class="round" onclick="Game.toggleChat()" title="Chat">☵</button>
        <button class="round" onclick="Game.players()" title="Players">☷</button>
        <button class="round" onclick="Game.openMenu()" title="Menu">☰</button>
        <button class="round" onclick="Game.leave()" title="Leave">×</button>
      </div>
    </div>
    <div id="levelBox" class="levelBox">Level 1</div>
    <div id="deathBanner" class="deathBanner">Back to last checkpoint</div>
    <div id="gameSide" class="sidePanel"></div>
    <div class="mobileControls">
      <div id="joy" class="joy"><div id="stick" class="stick"></div></div>
      <button class="jump" onpointerdown="this.blur()" onclick="Game.jump()">↑</button>
    </div>
    <div class="gameHint">WASD move · mouse drag camera · Space jump · controller supported</div>
    <div id="pauseOverlay" class="pauseOverlay">
      <h2>Menu</h2>
      <button class="btn blue" onclick="Game.openMenu()">Resume</button>
      <button class="btn" onclick="Game.leave()">Leave Game</button>
      <div class="menuAccounts">
        <div class="treeTitle" style="text-align:left">SIGNED IN AS</div>
        <div id="menuAccountInfo"></div>
      </div>
    </div>
  </div>
</section>


<section id="studio" class="screen">
  <div class="studioBar">
    <button onclick="Studio.back()">←</button>
    <b>PLAZOID STUDIO</b>
    <button class="active" id="toolSelect" onclick="Studio.setTool('select')">Select</button>
    <button id="toolMove" onclick="Studio.setTool('move')">Move</button>
    <button id="toolRotate" onclick="Studio.setTool('rotate')">Rotate</button>
    <button id="toolScale" onclick="Studio.setTool('scale')">Scale</button>
    <button onclick="Studio.addBlock()">＋ Block</button>
    <button onclick="Studio.addScript()">＋ Script</button>
    <button onclick="Studio.addGui()">＋ GUI</button>
    <button onclick="Studio.deleteSelected()">Delete</button>
    <span style="flex:1"></span>
    <button onclick="Studio.save()">Save</button>
    <button onclick="Studio.test()">▶ Test</button>
    <button onclick="Studio.publish()">Publish</button>
  </div>
  <div class="studioLayout">
    <aside class="studioPanel leftPanel">
      <b>EXPLORER</b>
      <div class="treeTitle">GAME</div>
      <div id="tree"></div>
      <div class="treeTitle">PROJECT</div>
      <button onclick="Studio.newProject()">New Project</button>
      <p class="status" id="studioStatus"></p>
    </aside>
    <main id="studioViewport" class="studioViewport"></main>
    <aside class="studioPanel rightPanel">
      <b>PROPERTIES</b>
      <div id="properties"><p class="status">Select an object.</p></div>
    </aside>
  </div>
  <div class="studioMobile">
    <button onclick="Studio.addBlock()">＋ Block</button>
    <button onclick="Studio.setTool('move')">Move</button>
    <button onclick="Studio.setTool('rotate')">Rotate</button>
    <button onclick="Studio.setTool('scale')">Scale</button>
    <button onclick="Studio.deleteSelected()">Delete</button>
  </div>
</section>

<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button class="close" onclick="UI.close()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

const DB={
  data:{},
  user:null, // live pointer to the current signed-in person's local avatar/inventory record - see setActiveUid()
  load(){
    try{this.data=JSON.parse(localStorage.getItem(STORE))||{}}catch{this.data={}}
    if(!this.data.userRecords)this.data.userRecords={}; // uid -> {name, avatar, inventory} - local customization per real account on this device
    if(!this.data.projects)this.data.projects=[];
    if(!this.data.settings)this.data.settings={graphics:'Medium',volume:1,music:1,sensitivity:.75,ui:1};
    // games list is always derived fresh from DEFAULT_GAMES - never persisted/mutated,
    // so a Studio publish can never leak into it even indirectly via old saved state
    this.data.games=DEFAULT_GAMES;
    this.save()
  },
  // Called once someone is authenticated (or logs out) - points DB.user at their local
  // avatar/inventory record on THIS device, creating one on first sign-in. Every existing
  // place in this file that reads/writes DB.data.user.avatar.skin etc keeps working exactly
  // as before, it's just now scoped to whichever real account is currently signed in.
  setActiveUid(uid,displayName){
    if(!uid){this.user=null;this.data.user=null;return}
    if(!this.data.userRecords[uid]){
      this.data.userRecords[uid]={name:displayName||'Player',inventory:[],avatar:{skin:'#d79a72',shirt:'#5268e8',pants:'#303849',face:'🙂'}};
      this.save();
    }else if(displayName&&this.data.userRecords[uid].name!==displayName){
      // Firebase's displayName is the source of truth for the name - keep this
      // device's local record in sync with it on every sign-in, not just the first.
      // Avatar/inventory customization is untouched here, only the name field.
      this.data.userRecords[uid].name=displayName;
      this.save();
    }
    this.user=this.data.userRecords[uid];
    this.data.user=this.user;
  },
  save(){
    const toSave={...this.data};
    delete toSave.games; // never persist the games list - it's always derived from DEFAULT_GAMES
    delete toSave.user;  // DB.data.user is a live pointer for compatibility, the real data lives in userRecords[uid]
    localStorage.setItem(STORE,JSON.stringify(toSave))
  }
};
DB.load();

/*
  Client-side word filter. This runs entirely in the browser, so it catches
  common/casual bad language and simple leetspeak substitutions - it is NOT
  abuse-resistant moderation. Anyone can read or work around client-side JS,
  and a determined person can always find a spelling this doesn't catch. Real
  moderation needs a server. Matches are replaced with asterisks of the same
  length rather than blocking the whole message, so filtering doesn't feel
  like a hard wall for accidental/casual language.
*/
const BAD_WORDS=['fuck','shit','bitch','asshole','cunt','dick','piss','bastard','slut','whore','nigger','nigga','fag','faggot','retard','rape'];
const LEET_SUBS={a:'a4@',e:'e3',i:'i1!',o:'o0',u:'u*'};
function toLeetPattern(word){
  return word.split('').map(ch=>{
    const opts=LEET_SUBS[ch.toLowerCase()];
    return opts?'['+opts+']':ch;
  }).join('');
}
const BAD_WORDS_RE=new RegExp('\\b('+BAD_WORDS.map(toLeetPattern).join('|')+')\\b','gi');
function filterBadWords(text){
  return String(text??'').replace(BAD_WORDS_RE,m=>'*'.repeat(m.length));
}

// Fix: clicking any on-screen button (HUD icons, mobile jump button, etc.) leaves that
// button holding keyboard focus. While a <button> has focus, browsers treat Space as
// "activate this button" instead of delivering it as a normal keydown to the game -
// so after tapping the jump button once, or any HUD icon, Space silently stopped working
// for jumping. Blurring right after any button click keeps focus from sticking anywhere,
// so Space always reaches the game regardless of what was last clicked or tapped.
addEventListener('click',e=>{if(e.target.closest?.('button'))e.target.closest('button').blur()},true);

/* ====================================================================
   CHARACTER RIG
   Roblox-classic blocky proportions, but WITH arms, and every limb group
   pivots at its actual joint (shoulder/hip/neck) rather than its own
   center, so rotating a limb swings it naturally instead of spinning a
   block in place. Fully procedural animation - no external assets.
   ==================================================================== */
function buildCharacter(avatar){
  const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:.05});
  const root=new THREE.Group();
  root.name='characterRoot';

  const torso=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.2,.6),mat(avatar.shirt));
  torso.position.y=1.6;
  torso.castShadow=true;
  root.add(torso);

  const headPivot=new THREE.Group();
  headPivot.position.y=2.2;
  const head=new THREE.Mesh(new THREE.BoxGeometry(.85,.85,.85),mat(avatar.skin));
  head.position.y=.425;
  head.castShadow=true;
  headPivot.add(head);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(.46,.26),new THREE.MeshBasicMaterial({color:0x1a1a1a}));
  face.position.set(0,.42,.427);
  headPivot.add(face);
  root.add(headPivot);

  function buildArm(side){
    const pivot=new THREE.Group();
    pivot.position.set(side*.68,2.05,0);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.38,1.1,.38),mat(avatar.skin));
    arm.position.y=-.55;
    arm.castShadow=true;
    pivot.add(arm);
    return pivot;
  }
  const leftArmPivot=buildArm(-1),rightArmPivot=buildArm(1);
  root.add(leftArmPivot,rightArmPivot);

  function buildLeg(side){
    const pivot=new THREE.Group();
    pivot.position.set(side*.28,1.0,0);
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.42,1.0,.42),mat(avatar.pants));
    leg.position.y=-.5;
    leg.castShadow=true;
    pivot.add(leg);
    return pivot;
  }
  const leftLegPivot=buildLeg(-1),rightLegPivot=buildLeg(1);
  root.add(leftLegPivot,rightLegPivot);

  root.userData.rig={torso,headPivot,leftArmPivot,rightArmPivot,leftLegPivot,rightLegPivot};
  root.userData.animPhase=0;
  root.userData.landSquash=0;
  root.traverse(o=>{if(o.isMesh)o.receiveShadow=false});
  return root;
}

function animateCharacter(root,dt,state){
  const rig=root.userData.rig;
  if(!rig)return;

  if(state.facing!==null&&state.speed>.02){
    let diff=state.facing-root.rotation.y;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    root.rotation.y+=diff*Math.min(1,dt*12);
  }

  const grounded=state.onGround,speed=state.speed;

  if(!grounded){
    const rising=state.velY>.5;
    const targetArm=rising?-.9:.5;
    const targetLeg=rising?.35:-.15;
    rig.leftArmPivot.rotation.x+=(targetArm-rig.leftArmPivot.rotation.x)*Math.min(1,dt*10);
    rig.rightArmPivot.rotation.x+=(targetArm-rig.rightArmPivot.rotation.x)*Math.min(1,dt*10);
    rig.leftLegPivot.rotation.x+=(targetLeg-rig.leftLegPivot.rotation.x)*Math.min(1,dt*10);
    rig.rightLegPivot.rotation.x+=(-targetLeg-rig.rightLegPivot.rotation.x)*Math.min(1,dt*10);
    rig.leftArmPivot.rotation.z=0;
    rig.rightArmPivot.rotation.z=0;
  }else if(speed>.05){
    root.userData.animPhase+=dt*(6+speed*6);
    const swing=Math.sin(root.userData.animPhase)*(.55+speed*.3);
    rig.leftArmPivot.rotation.x=swing;
    rig.rightArmPivot.rotation.x=-swing;
    rig.leftLegPivot.rotation.x=-swing;
    rig.rightLegPivot.rotation.x=swing;
    rig.leftArmPivot.rotation.z=0;
    rig.rightArmPivot.rotation.z=0;
    rig.torso.position.y=1.6+Math.abs(Math.sin(root.userData.animPhase*2))*.03;
  }else{
    root.userData.animPhase+=dt*1.4;
    const idleSway=Math.sin(root.userData.animPhase)*.045;
    rig.leftArmPivot.rotation.x+=(idleSway-rig.leftArmPivot.rotation.x)*Math.min(1,dt*6);
    rig.rightArmPivot.rotation.x+=(-idleSway-rig.rightArmPivot.rotation.x)*Math.min(1,dt*6);
    rig.leftLegPivot.rotation.x+=(0-rig.leftLegPivot.rotation.x)*Math.min(1,dt*8);
    rig.rightLegPivot.rotation.x+=(0-rig.rightLegPivot.rotation.x)*Math.min(1,dt*8);
    rig.leftArmPivot.rotation.z+=(.06-rig.leftArmPivot.rotation.z)*Math.min(1,dt*6);
    rig.rightArmPivot.rotation.z+=(-.06-rig.rightArmPivot.rotation.z)*Math.min(1,dt*6);
    rig.torso.position.y=1.6+Math.sin(root.userData.animPhase*.5)*.015;
  }

  if(state.justLanded)root.userData.landSquash=1;
  if(root.userData.landSquash>0){
    root.userData.landSquash=Math.max(0,root.userData.landSquash-dt*5.5);
    const s=root.userData.landSquash;
    root.scale.set(1+s*.12,1-s*.18,1+s*.12);
  }else{
    root.scale.set(1,1,1);
  }
}

/* ====================================================================
   PHYSICS
   Axis-separated AABB resolution: move X, resolve X collisions; move Z,
   resolve Z; move Y, resolve Y. This gives correct wall-blocking/sliding
   and correct top-landing detection, and was verified with unit tests
   against fast falls, side approaches, wall clips, and ceiling hits.
   ==================================================================== */
const PLAYER_HALF_W=.55,PLAYER_HEIGHT=2.0,STEP_UP=.25,MAX_STEP_DELTA=.4;

function boxHalfExtents(part){return{hx:part.size[0]/2,hy:part.size[1]/2,hz:part.size[2]/2}}

function resolveAxis(pos,axis,delta,feetY,parts){
  if(delta===0)return pos[axis];
  delta=Math.max(-MAX_STEP_DELTA,Math.min(MAX_STEP_DELTA,delta));
  let next=pos[axis]+delta;
  const other=axis==='x'?'z':'x';
  for(const part of parts){
    if(!part.solid)continue;
    const{hx,hy,hz}=boxHalfExtents(part);
    const[cx,cy,cz]=part.pos;
    if(feetY+STEP_UP>=cy+hy||feetY+PLAYER_HEIGHT<=cy-hy)continue;
    const halfSpan=axis==='x'?hx:hz;
    const otherHalfSpan=axis==='x'?hz:hx;
    const centerMain=axis==='x'?cx:cz;
    const centerOther=axis==='x'?cz:cx;
    if(Math.abs(pos[other]-centerOther)>=PLAYER_HALF_W+otherHalfSpan)continue;
    const wouldOverlap=Math.abs(next-centerMain)<PLAYER_HALF_W+halfSpan;
    const wasOutside=Math.abs(pos[axis]-centerMain)>=PLAYER_HALF_W+halfSpan;
    if(wouldOverlap&&wasOutside){
      const sign=Math.sign(pos[axis]-centerMain)||Math.sign(delta)||1;
      next=centerMain+sign*(PLAYER_HALF_W+halfSpan+.001);
    }
  }
  return next;
}

function resolveVertical(px,pz,feetY,nextFeetY,velY,parts){
  let grounded=false,landedPart=null,hitCeiling=false,resultY=nextFeetY;
  for(const part of parts){
    if(!part.solid)continue;
    const{hx,hy,hz}=boxHalfExtents(part);
    const[cx,cy,cz]=part.pos;
    if(Math.abs(px-cx)>=PLAYER_HALF_W+hx)continue;
    if(Math.abs(pz-cz)>=PLAYER_HALF_W+hz)continue;
    const top=cy+hy,bottom=cy-hy;
    if(velY<=0&&feetY>=top-.01&&nextFeetY<=top){
      resultY=Math.max(resultY,top);grounded=true;landedPart=part;
    }else if(velY>0&&feetY+PLAYER_HEIGHT<=bottom+.01&&nextFeetY+PLAYER_HEIGHT>bottom){
      resultY=Math.min(resultY,bottom-PLAYER_HEIGHT);hitCeiling=true;
    }
  }
  return{y:resultY,grounded,landedPart,hitCeiling};
}

/* ==================== GAME / SIMPLE OBBY ==================== */
const Game={
  renderer:null,scene:null,camera:null,player:null,parts:[],keys:{},
  velY:0,onGround:false,run:false,yaw:0,pitch:-.25,camDist:8,last:0,
  checkpoint:-1,spawn:new THREE.Vector3(0,2,0),touch:{x:0,y:0},pad:null,
  drag:false,lastX:0,lastY:0,paused:false,current:null,customParts:null,
  facing:0,wasGrounded:false,camRay:null,fallStartY:null,

  launch(id){
    if(!DB.user){AuthUI.open();toast('Sign in to play and save your progress');return}
    const g=DB.data.games.find(x=>x.id===id);
    if(!g)return;
    this.current=g;
    this.customParts=null;
    show('game');
    this.startObby();
  },

  // called from Studio.test() - loads the studio project's own placed Parts instead
  // of the hardcoded default course, so Test actually reflects what you built
  launchCustom(project){
    if(!DB.user){AuthUI.open();toast('Sign in to test your project');return}
    this.current={id:'studioTest',name:project.name,creator:'You',type:'studio'};
    this.customParts=(project.objects||[]).filter(o=>o.type==='Part').map(o=>[
      o.name||'Part',[o.x,o.y,o.z],[2*o.sx,2*o.sy,2*o.sz],[o.rx*180/Math.PI,o.ry*180/Math.PI,o.rz*180/Math.PI]
    ]);
    show('game');
    this.startObby();
  },

  startObby(){
    this.init();
    this.buildObby();
    this.resetPlayer();
    document.getElementById('gameTitle').textContent=this.current?.name||'Plazoid';
    this.run=true;
    this.paused=false;
    document.getElementById('pauseOverlay').classList.remove('open');
    this.last=performance.now();
    requestAnimationFrame(t=>this.loop(t));
  },

  init(){
    if(this.renderer)return;
    const c=document.getElementById('gameCanvas');
    this.scene=new THREE.Scene();
    this.scene.background=new THREE.Color(0x8ec3e0);
    this.scene.fog=new THREE.Fog(0x8ec3e0,70,180);
    this.camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);
    this.renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    this.renderer.setSize(innerWidth,innerHeight);
    this.renderer.shadowMap.enabled=true;
    this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;

    const hemi=new THREE.HemisphereLight(0xbfe0ff,0x445566,1.1);
    this.scene.add(hemi);
    const sun=new THREE.DirectionalLight(0xfff4e0,1.6);
    sun.position.set(30,45,20);
    sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    sun.shadow.camera.left=-60;sun.shadow.camera.right=60;
    sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;
    sun.shadow.camera.far=150;
    this.scene.add(sun);
    this.sun=sun;

    this.ray=new THREE.Raycaster();
    this.camRay=new THREE.Raycaster();

    addEventListener('resize',()=>{
      if(this.camera){this.camera.aspect=innerWidth/innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight)}
    });
    addEventListener('keydown',e=>{this.keys[e.code]=true;if(e.code==='Space'){e.preventDefault();this.jump()}});
    addEventListener('keyup',e=>this.keys[e.code]=false);
    c.addEventListener('pointerdown',e=>{this.drag=true;this.lastX=e.clientX;this.lastY=e.clientY;c.setPointerCapture?.(e.pointerId)});
    c.addEventListener('pointermove',e=>{
      if(!this.drag)return;
      this.yaw-=(e.clientX-this.lastX)*.006*DB.data.settings.sensitivity;
      this.pitch-=(e.clientY-this.lastY)*.004*DB.data.settings.sensitivity;
      this.pitch=Math.max(-1.05,Math.min(.7,this.pitch));
      this.lastX=e.clientX;this.lastY=e.clientY;
    });
    c.addEventListener('pointerup',()=>this.drag=false);
    this.setupJoystick();
    this.setupGamepad();
    this.applyGraphicsQuality();
  },

  applyGraphicsQuality(){
    if(!this.renderer)return;
    const q=DB.data.settings.graphics;
    this.renderer.shadowMap.enabled=q!=='Low';
    this.renderer.setPixelRatio(q==='High'?Math.min(devicePixelRatio,2):q==='Low'?1:Math.min(devicePixelRatio,1.5));
  },

  setupJoystick(){
    const joy=document.getElementById('joy'),stick=document.getElementById('stick');
    const move=e=>{
      const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
      this.touch.x=Math.cos(a)*m/50;this.touch.y=Math.sin(a)*m/50;
      stick.style.transform=`translate(calc(-50% + ${this.touch.x*42}px),calc(-50% + ${this.touch.y*42}px))`;
    };
    joy.onpointerdown=e=>{joy.setPointerCapture?.(e.pointerId);move(e)};
    joy.onpointermove=e=>move(e);
    joy.onpointerup=joy.onpointercancel=()=>{this.touch.x=this.touch.y=0;stick.style.transform='translate(-50%,-50%)'};
  },

  setupGamepad(){setInterval(()=>{const pads=navigator.getGamepads?.()||[];this.pad=[...pads].find(Boolean)},100)},

  buildObby(){
    this.parts.forEach(p=>this.scene.remove(p.mesh));
    this.parts=[];
    this.checkpointsActivated=new Set();
    this.checkpointOrder=[];
    let rows;
    if(this.customParts&&this.customParts.length){
      rows=this.customParts;
    }else if(this.current?.type==='parkour'){
      rows=PARKOUR_COURSE;
    }else{
      rows=DEFAULT_OBBY;
    }
    for(const row of rows){
      const[name,pos,size,rot,color]=row;
      this.addPart(name,pos,size,rot,color);
    }
    this.updateLevel(-1,false);
  },

  addPart(name,pos,size,rot,rgb){
    const isCheckpoint=/^Checkpoint/.test(name)||name==='Touch',isSpawn=name==='Spawnpoint'||name==='Spawn';
    // Parkour parts carry an explicit RGB color from the source data; the classic
    // obby has no color field, so it keeps its original scheme (gray platforms,
    // green checkpoints, blue spawn) unless this row overrides it.
    const color=rgb?(rgb[0]<<16|rgb[1]<<8|rgb[2]):(isCheckpoint?0x39d98a:isSpawn?0x0aa7e8:0x5b7291);
    const geo=new THREE.BoxGeometry(size[0],size[1],size[2]);
    const mat=new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.08,emissive:isCheckpoint?0x0d3d26:0x000000,emissiveIntensity:isCheckpoint?.4:0});
    const m=new THREE.Mesh(geo,mat);
    m.position.set(...pos);
    m.rotation.set(...rot.map(x=>x*Math.PI/180));
    m.receiveShadow=true;
    m.castShadow=true;
    this.scene.add(m);

    // thin top-edge highlight so platforms visually separate from each other and
    // the background instead of reading as flat same-tone gray boxes
    const edgeGeo=new THREE.EdgesGeometry(geo);
    const edge=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:isCheckpoint?0x8fffce:0xaebfd4,transparent:true,opacity:.5}));
    edge.position.copy(m.position);
    edge.rotation.copy(m.rotation);
    this.scene.add(edge);

    // Checkpoint ID: for the numbered classic-obby scheme the name itself is unique
    // and stable, so it's used directly. For the parkour course's generic repeated
    // "Touch"/"Spawn" names, position is used instead, since it's what's actually
    // unique per checkpoint here - rounded to absorb the ~0.01-0.02 float rounding
    // noise observed in the source data between a Touch and its paired Spawn.
    const checkpointId=isCheckpoint||isSpawn?`${Math.round(pos[0]*10)},${Math.round(pos[1]*10)},${Math.round(pos[2]*10)}`:null;

    this.parts.push({name,pos,size,rot,mesh:m,edge,solid:true,checkpointPulse:isCheckpoint?Math.random()*10:null,isCheckpoint,isSpawn,checkpointId});
  },

  resetPlayer(){
    if(this.player)this.scene.remove(this.player);
    this.player=buildCharacter(DB.data.user.avatar);
    const startPos=this.current?.type==='parkour'?SPAWN_LOCATION:[0,2,0];
    this.spawn.set(...startPos);
    this.player.position.copy(this.spawn);
    this.scene.add(this.player);
    this.velY=0;this.onGround=false;this.checkpoint=-1;
  },

  refreshAvatarIfActive(){
    if(document.getElementById('game').classList.contains('active')&&this.player){
      const pos=this.player.position.clone(),rotY=this.player.rotation.y;
      this.scene.remove(this.player);
      this.player=buildCharacter(DB.data.user.avatar);
      this.player.position.copy(pos);
      this.player.rotation.y=rotY;
      this.scene.add(this.player);
    }
  },

  jump(){if(this.onGround&&!this.paused){this.velY=8.5;this.onGround=false}},

  respawn(){
    this.player.position.copy(this.spawn);
    this.velY=0;
    const banner=document.getElementById('deathBanner');
    banner.classList.add('show');
    setTimeout(()=>banner.classList.remove('show'),1000);
  },

  checkCheckpoint(part){
    if(part.name==='Spawnpoint'){
      // stepping back on the classic obby's spawn plate doesn't regress progress
      return;
    }else if(/^Checkpoint/.test(part.name)){
      // classic numbered-checkpoint scheme - unchanged
      const n=parseInt(part.name.replace('Checkpoint',''));
      if(n>this.checkpoint){
        this.checkpoint=n;
        this.spawn.set(part.pos[0],part.pos[1]+part.size[1]/2+.05,part.pos[2]);
        this.updateLevel(n,true);
      }
    }else if(part.isCheckpoint&&part.checkpointId){
      // parkour course - dynamic first-touch ordering: whichever checkpoint the
      // player reaches first becomes #1, and so on. Touching one already reached
      // does nothing (checkpointsActivated guards against re-counting).
      if(!this.checkpointsActivated.has(part.checkpointId)){
        this.checkpointsActivated.add(part.checkpointId);
        this.checkpointOrder.push(part.checkpointId);
        this.spawn.set(part.pos[0],part.pos[1]+part.size[1]/2+.05,part.pos[2]);
        this.updateLevel(this.checkpointOrder.length-1,true);
      }
    }
  },

  updateLevel(n,bump){
    const box=document.getElementById('levelBox');
    if(this.current?.type==='parkour'){
      const total=this.parts.filter(p=>p.isCheckpoint).length;
      box.textContent=n<0?`Checkpoint 0 of ${total}`:`Checkpoint ${n+1} of ${total}`;
    }else{
      box.textContent=n<0?'Level 1':`Level ${n+1}`;
    }
    if(bump){box.classList.add('bump');setTimeout(()=>box.classList.remove('bump'),250)}
  },

  loop(now){
    if(!this.run)return;
    requestAnimationFrame(t=>this.loop(t));
    let dt=Math.min(.033,(now-this.last)/1000);
    this.last=now;
    if(this.paused)return;

    let ax=(this.keys.KeyD?1:0)-(this.keys.KeyA?1:0)+(this.pad?.axes?.[0]||0)+this.touch.x;
    let az=(this.keys.KeyS?1:0)-(this.keys.KeyW?1:0)+(this.pad?.axes?.[1]||0)+this.touch.y;
    let len=Math.hypot(ax,az);
    if(len>1){ax/=len;az/=len}
    const speed=7;
    const sin=Math.sin(this.yaw),cos=Math.cos(this.yaw);
    let dx=(ax*cos+az*sin)*speed*dt,dz=(-ax*sin+az*cos)*speed*dt;

    // axis-separated resolution: resolve X, then Z against the (possibly already
    // X-adjusted) position, then Y - this is what prevents corner-clipping and
    // gives clean wall sliding
    const pos={x:this.player.position.x,z:this.player.position.z};
    const feetY=this.player.position.y;
    pos.x=resolveAxis(pos,'x',dx,feetY,this.parts);
    pos.z=resolveAxis(pos,'z',dz,feetY,this.parts);
    this.player.position.x=pos.x;
    this.player.position.z=pos.z;

    if(this.pad?.buttons?.[0]?.pressed)this.jump();

    this.velY-=14.34*dt;
    const nextY=this.player.position.y+this.velY*dt;
    const v=resolveVertical(this.player.position.x,this.player.position.z,this.player.position.y,nextY,this.velY,this.parts);
    const justLanded=v.grounded&&!this.wasGrounded&&this.velY<-3;
    this.player.position.y=v.y;
    if(v.hitCeiling)this.velY=Math.min(this.velY,0);
    this.onGround=v.grounded;
    if(v.grounded)this.velY=0;
    if(v.landedPart)this.checkCheckpoint(v.landedPart);
    this.wasGrounded=v.grounded;

    if(this.player.position.y<-14){
      this.respawn();
    }

    // character animation state
    const horizSpeed=Math.hypot(dx,dz)/(speed*dt||1);
    const facing=(Math.abs(dx)>.0005||Math.abs(dz)>.0005)?Math.atan2(dx,dz):null;
    animateCharacter(this.player,dt,{speed:Math.min(1,horizSpeed),onGround:this.onGround,velY:this.velY,justLanded,facing});

    // checkpoint pulse animation
    for(const p of this.parts){
      if(p.checkpointPulse!==null){
        p.checkpointPulse+=dt;
        p.mesh.material.emissiveIntensity=.3+Math.sin(p.checkpointPulse*2.4)*.15;
      }
    }

    // third-person camera with a simple pullback raycast so it doesn't clip
    // through platforms when orbiting close to geometry
    const target=this.player.position.clone();
    target.y+=1.7;
    const dir=new THREE.Vector3(Math.sin(this.yaw)*Math.cos(this.pitch),Math.sin(this.pitch),Math.cos(this.yaw)*Math.cos(this.pitch));
    let dist=this.camDist;
    this.camRay.set(target,dir);
    const hits=this.camRay.intersectObjects(this.parts.map(p=>p.mesh));
    if(hits.length&&hits[0].distance<dist)dist=Math.max(1.5,hits[0].distance-.3);
    this.camera.position.copy(target).addScaledVector(dir,dist);
    this.camera.lookAt(target);

    this.renderer.render(this.scene,this.camera);
  },

  toggleChat(){
    const e=document.getElementById('gameSide');
    e.classList.toggle('open');
    if(!e.classList.contains('open'))return;
    e.innerHTML=`<h3>Chat</h3><div class="chatLog" id="chatLog"><div class="msg"><b>Nova</b>: Welcome to ${esc(this.current?.name||'Plazoid')}!</div></div><div class="chatRow"><input id="chatInput" placeholder="Message"><button class="btn blue" onclick="Game.sendChat()">Send</button></div>`;
  },
  sendChat(){
    const i=document.getElementById('chatInput');
    if(!i?.value.trim())return;
    document.getElementById('chatLog').innerHTML+=`<div class="msg"><b>${esc(DB.data.user.name)}</b>: ${esc(i.value)}</div>`;
    document.getElementById('chatLog').scrollTop=9999;
    i.value='';
  },
  players(){
    const e=document.getElementById('gameSide');
    e.classList.toggle('open');
    if(!e.classList.contains('open'))return;
    e.innerHTML='<h3>Players</h3>'+[DB.data.user.name].map(x=>`<div class="pill" style="margin:5px 0">● ${esc(x)}</div>`).join('');
  },
  openMenu(){
    this.paused=!this.paused;
    document.getElementById('pauseOverlay').classList.toggle('open',this.paused);
    if(this.paused)window.AuthUI?.refreshMenuInfo?.();
  },
  leave(){this.run=false;this.customParts=null;show('home');Home.render()}
};

/* ====================================================================
   STUDIO / HIERARCHY / LUA / GUI
   Unchanged tool workflow from the original, but Test now actually loads
   the project's own Parts into the game (see Game.launchCustom above),
   and Publish only ever marks the project itself as published - it never
   writes into DB.data.games, since that list is reserved for official
   games and there's no shared backend for other people to see this.
   ==================================================================== */
const Studio={
  scene:null,camera:null,renderer:null,ray:null,objects:[],selected:null,tool:'select',
  project:null,drag:false,lastX:0,lastY:0,orbitX:.7,orbitY:.45,dist:22,

  open(){show('studio');setTimeout(()=>this.init(),20)},

  init(){
    if(this.renderer){this.refresh();return}
    const host=document.getElementById('studioViewport');
    this.scene=new THREE.Scene();
    this.scene.background=new THREE.Color(0x0b111a);
    this.camera=new THREE.PerspectiveCamera(55,Math.max(1,host.clientWidth)/Math.max(1,host.clientHeight),.1,500);
    this.renderer=new THREE.WebGLRenderer({antialias:true});
    host.appendChild(this.renderer.domElement);
    this.ray=new THREE.Raycaster();
    this.scene.add(new THREE.HemisphereLight(0xffffff,0x394554,2));
    this.scene.add(new THREE.GridHelper(80,80));
    this.resize();
    addEventListener('resize',()=>this.resize());
    this.bindCamera();
    this.project=DB.data.projects[0]||this.createProject('My First Game');
    this.loadProject(this.project);
    this.renderLoop();
  },

  resize(){
    const h=document.getElementById('studioViewport');
    if(!this.renderer)return;
    this.renderer.setSize(h.clientWidth,h.clientHeight);
    this.camera.aspect=Math.max(1,h.clientWidth)/Math.max(1,h.clientHeight);
    this.camera.updateProjectionMatrix();
  },

  bindCamera(){
    const c=this.renderer.domElement;
    c.addEventListener('pointerdown',e=>{this.drag=true;this.lastX=e.clientX;this.lastY=e.clientY;if(this.tool==='select')this.pick(e)});
    c.addEventListener('pointermove',e=>{
      if(!this.drag)return;
      const dx=e.clientX-this.lastX,dy=e.clientY-this.lastY;
      this.lastX=e.clientX;this.lastY=e.clientY;
      if(this.tool==='select'){
        this.orbitX-=dx*.008;
        this.orbitY=Math.max(-1.2,Math.min(1.2,this.orbitY-dy*.008));
      }else if(this.selected){
        if(this.tool==='move'){this.selected.x+=dx*.035;this.selected.z+=dy*.035;this.syncMesh()}
        else if(this.tool==='rotate'){this.selected.ry+=dx*.01;this.syncMesh()}
        else if(this.tool==='scale'){this.selected.sx=Math.max(.1,this.selected.sx+dx*.01);this.selected.sy=Math.max(.1,this.selected.sy-dy*.01);this.selected.sz=this.selected.sx;this.syncMesh()}
        this.refresh();
      }
    });
    c.addEventListener('pointerup',()=>this.drag=false);
    c.addEventListener('wheel',e=>{e.preventDefault();this.dist=Math.max(5,Math.min(60,this.dist+e.deltaY*.02))},{passive:false});
  },

  pick(e){
    const r=this.renderer.domElement.getBoundingClientRect();
    const mouse=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
    this.ray.setFromCamera(mouse,this.camera);
    const hit=this.ray.intersectObjects(this.objects.map(o=>o.mesh).filter(Boolean));
    if(hit.length){this.selected=this.objects.find(o=>o.mesh===hit[0].object);this.refresh()}
  },

  createProject(name){
    const p={id:'p'+Date.now(),name,description:'',objects:[],lua:{},gui:[],published:false};
    DB.data.projects.push(p);
    DB.save();
    return p;
  },

  loadProject(p){
    this.project=p;
    this.objects=[];
    this.selected=null;
    this.scene.children.slice().filter(x=>x.userData?.plazoid).forEach(x=>this.scene.remove(x));
    (p.objects||[]).forEach(o=>this.addObject(o,false));
    this.refresh();
  },

  addObject(o,save=true){
    const obj=JSON.parse(JSON.stringify(o));
    if(!obj.id)obj.id='obj'+Date.now()+Math.random();
    if(obj.type==='Part')this.makeMesh(obj);
    this.objects.push(obj);
    if(save)this.save();
  },

  makeMesh(o){
    const m=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:o.color||'#6573ff'}));
    m.userData.plazoid=true;
    m.userData.id=o.id;
    o.mesh=m;
    this.scene.add(m);
    this.syncMesh(o);
  },

  syncMesh(o=this.selected){
    if(!o?.mesh)return;
    o.mesh.position.set(o.x,o.y,o.z);
    o.mesh.rotation.set(o.rx,o.ry,o.rz);
    o.mesh.scale.set(o.sx,o.sy,o.sz);
  },

  addBlock(){
    this.addObject({id:'',name:'Part',type:'Part',parent:'Workspace',x:0,y:1,z:0,rx:0,ry:0,rz:0,sx:1,sy:1,sz:1,color:'#6573ff'});
    this.selected=this.objects.at(-1);
    this.refresh();
  },
  addScript(){
    const parent=this.selected?.id||'Workspace';
    this.addObject({id:'',name:'Script',type:'Script',parent,source:'-- Plazoid Lua Script\nfunction onStart()\n    print("Hello from Plazoid!")\nend\n'});
    this.selected=this.objects.at(-1);
    this.refresh();
  },
  addGui(){
    this.addObject({id:'',name:'ScreenGui',type:'GUI',parent:'StarterGui',guiType:'Frame',text:'',color:'#202a3b'});
    this.selected=this.objects.at(-1);
    this.refresh();
  },
  setTool(t){
    this.tool=t;
    document.querySelectorAll('.studioBar button').forEach(b=>b.classList.remove('active'));
    document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active');
    toast('Tool: '+t);
  },
  deleteSelected(){
    if(!this.selected)return;
    const id=this.selected.id;
    this.objects=this.objects.filter(o=>o.id!==id);
    this.scene.remove(this.selected.mesh);
    this.selected=null;
    this.save();
    this.refresh();
  },
  save(){
    this.project.objects=this.objects.map(o=>{const q={...o};delete q.mesh;return q});
    DB.save();
    document.getElementById('studioStatus').textContent='Saved locally · '+new Date().toLocaleTimeString();
    toast('Project saved');
  },
  newProject(){
    const n=prompt('Project name','New Plazoid Game');
    if(!n)return;
    this.project=this.createProject(n);
    this.loadProject(this.project);
  },

  // Publish only marks the project itself as published within your own account.
  // It intentionally never writes to DB.data.games (the official/shared list) -
  // this prototype has no server, so there's no mechanism for anyone else to
  // ever see or play another person's Studio project.
  publish(){
    this.save();
    this.project.published=true;
    DB.save();
    toast('Saved to your Studio projects');
    document.getElementById('studioStatus').textContent='Published (visible only in your own Studio) · '+new Date().toLocaleTimeString();
  },

  test(){
    this.save();
    Game.launchCustom(this.project);
  },

  back(){this.save();Home.render()},

  tree(){
    const roots=['Workspace','Players','Lighting','ReplicatedStorage','ServerScriptService','StarterGui'];
    let h=roots.map(r=>`<div class="treeNode">▸ ${r}</div>`).join('');
    for(const o of this.objects){
      h+=`<div class="treeNode child ${this.selected?.id===o.id?'selected':''}" onclick="Studio.selected=Studio.objects.find(x=>x.id==='${o.id}');Studio.refresh()">${o.type==='Script'?'📜':o.type==='GUI'?'▣':'□'} ${esc(o.name)}</div>`;
    }
    return h;
  },

  refresh(){
    document.getElementById('tree').innerHTML=this.tree();
    const p=this.selected;
    if(!p){document.getElementById('properties').innerHTML='<p class="status">Select an object in the viewport or Explorer.</p>';return}
    if(p.type==='Script'){
      document.getElementById('properties').innerHTML=`
      <div class="prop"><label>Name</label><input value="${esc(p.name)}" oninput="Studio.selected.name=this.value;Studio.save();Studio.refresh()"></div>
      <div class="prop"><label>Parent</label><select onchange="Studio.selected.parent=this.value;Studio.save();Studio.refresh()"><option>Workspace</option><option>ServerScriptService</option><option>ReplicatedStorage</option><option>Players</option></select></div>
      <div class="prop"><label>Lua Source</label><textarea class="scriptEditor" oninput="Studio.selected.source=this.value;Studio.save()">${esc(p.source)}</textarea></div>`;
    }else if(p.type==='GUI'){
      document.getElementById('properties').innerHTML=`
      <div class="prop"><label>Name</label><input value="${esc(p.name)}" oninput="Studio.selected.name=this.value;Studio.save();Studio.refresh()"></div>
      <div class="prop"><label>Parent</label><select onchange="Studio.selected.parent=this.value;Studio.save()"><option>StarterGui</option><option>Workspace</option></select></div>
      <div class="prop"><label>GUI Type</label><select onchange="Studio.selected.guiType=this.value;Studio.save()"><option>Frame</option><option>TextLabel</option><option>TextButton</option><option>ImageLabel</option></select></div>
      <div class="prop"><label>Text</label><input value="${esc(p.text||'')}" oninput="Studio.selected.text=this.value;Studio.save()"></div>`;
    }else{
      document.getElementById('properties').innerHTML=`
      <div class="prop"><label>Name</label><input value="${esc(p.name)}" oninput="Studio.selected.name=this.value;Studio.save();Studio.refresh()"></div>
      <div class="prop"><label>Parent</label><select onchange="Studio.selected.parent=this.value;Studio.save();Studio.refresh()">${['Workspace','ReplicatedStorage','StarterGui'].map(x=>`<option ${p.parent===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="prop"><label>Position X</label><input type="number" value="${p.x}" oninput="Studio.selected.x=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Position Y</label><input type="number" value="${p.y}" oninput="Studio.selected.y=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Position Z</label><input type="number" value="${p.z}" oninput="Studio.selected.z=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Rotation X</label><input type="number" value="${p.rx}" oninput="Studio.selected.rx=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Rotation Y</label><input type="number" value="${p.ry}" oninput="Studio.selected.ry=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Rotation Z</label><input type="number" value="${p.rz}" oninput="Studio.selected.rz=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Scale X</label><input type="number" step=".1" value="${p.sx}" oninput="Studio.selected.sx=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Scale Y</label><input type="number" step=".1" value="${p.sy}" oninput="Studio.selected.sy=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Scale Z</label><input type="number" step=".1" value="${p.sz}" oninput="Studio.selected.sz=+this.value;Studio.syncMesh();Studio.save()"></div>
      <div class="prop"><label>Color</label><input type="color" value="${p.color}" onchange="Studio.selected.color=this.value;Studio.selected.mesh.material.color.set(this.value);Studio.save()"></div>`;
    }
  },

  renderLoop(){
    requestAnimationFrame(()=>this.renderLoop());
    if(!this.renderer||!document.getElementById('studio').classList.contains('active'))return;
    const x=Math.cos(this.orbitX)*Math.cos(this.orbitY)*this.dist,y=Math.sin(this.orbitY)*this.dist,z=Math.sin(this.orbitX)*Math.cos(this.orbitY)*this.dist;
    this.camera.position.set(x,y,z);
    this.camera.lookAt(0,0,0);
    this.renderer.render(this.scene,this.camera);
  }
};

window.addEventListener('beforeunload',()=>DB.save());
</script>

<script type="module">
/* ====================================================================
   FIREBASE - real accounts + live presence.
   Loaded as an ES module (browser-native, no build step) via the gstatic
   CDN, matching how this whole project has no npm/bundler anywhere else.
   Everything the rest of the page needs (AuthUI, the presence count
   updater) is explicitly attached to window, since inline onclick="..."
   handlers and the classic <script> above can only reach window-scoped
   names - module scope does not leak out on its own.
   ==================================================================== */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {
  getDatabase, ref, onValue, set, onDisconnect, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';

const firebaseConfig={
  apiKey:"AIzaSyD2_iqakcH-QQZBA04j2UOCDqyL9DS_8lc",
  authDomain:"plazid-dabe1.firebaseapp.com",
  databaseURL:"https://plazid-dabe1-default-rtdb.firebaseio.com",
  projectId:"plazid-dabe1",
  storageBucket:"plazid-dabe1.firebasestorage.app",
  messagingSenderId:"807382185486",
  appId:"1:807382185486:web:673fe94c8722248bd8ee5f"
};

let auth,rtdb,firebaseReady=false;
try{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  rtdb=getDatabase(app);
  firebaseReady=true;
}catch(e){
  // If Firebase fails to initialize (network blocked, misconfigured project,
  // CDN unreachable), the rest of the game should still work - just without
  // accounts or a live count. Fail loudly in the console, gracefully in the UI.
  console.error('Firebase failed to initialize, accounts/live-count disabled:',e);
}

/* ---------- Presence (live player count) ---------- */
function startPresence(uid,name){
  if(!firebaseReady)return;
  const myPresenceRef=ref(rtdb,'presence/'+uid);
  const connectedRef=ref(rtdb,'.info/connected');
  onValue(connectedRef,(snap)=>{
    if(snap.val()!==true)return;
    // Register the disconnect handler FIRST and wait for the server to
    // acknowledge it before marking ourselves online - this is the standard
    // pattern (Firebase's own docs) that prevents a stale "online" entry if
    // something goes wrong between these two steps.
    onDisconnect(myPresenceRef).set({name,online:false,lastSeen:serverTimestamp()}).then(()=>{
      set(myPresenceRef,{name,online:true,lastSeen:serverTimestamp()});
    });
  });
}
function watchPresenceCount(){
  if(!firebaseReady){
    const el=document.getElementById('sessionCount');
    if(el)el.textContent='offline';
    return;
  }
  const presenceRef=ref(rtdb,'presence');
  onValue(presenceRef,(snap)=>{
    let count=0;
    snap.forEach(child=>{if(child.val()?.online===true)count++});
    const el=document.getElementById('sessionCount');
    if(el)el.textContent=count===1?'1 player online':count+' players online';
  });
}
watchPresenceCount();

/* ---------- Auth state -> drives DB.user, the nav button, and presence ---------- */
if(firebaseReady){
  onAuthStateChanged(auth,(user)=>{
    const navBtn=document.getElementById('navAuthBtn');
    if(user){
      DB.setActiveUid(user.uid,user.displayName||'Player');
      startPresence(user.uid,DB.user.name);
      if(navBtn){navBtn.textContent=DB.user.name.charAt(0).toUpperCase();navBtn.title=DB.user.name}
    }else{
      DB.setActiveUid(null);
      if(navBtn){navBtn.textContent='?';navBtn.title='Sign in'}
    }
    window.AuthUI?.refreshMenuInfo?.();
  });
}

/* ---------- AuthUI: sign up / sign in / sign out, via the existing modal ---------- */
window.AuthUI={
  open(){
    if(!firebaseReady){
      UI.modal('Accounts unavailable',`<p class="sub">Accounts couldn't connect right now. You can still play locally, but sign-in and live player count aren't available. Check your connection and reload.</p>`);
      return;
    }
    if(auth.currentUser){
      this.showAccountPanel();
    }else{
      this.showSignInForm();
    }
  },
  showSignInForm(mode='signin'){
    const isSignUp=mode==='signup';
    UI.modal(isSignUp?'Create account':'Sign in',`
      <div id="authError" class="sub" style="color:#e84653"></div>
      <div class="field"><label>Username</label><input id="authName" placeholder="Pick a username" maxlength="24" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="At least 6 characters"></div>
      <button class="btn blue" style="width:100%" onclick="AuthUI.submit('${isSignUp?'signup':'signin'}')">${isSignUp?'Create account':'Sign in'}</button>
      <p class="sub" style="margin-top:10px;text-align:center">${isSignUp?'Already have an account? <a href="#" onclick="event.preventDefault();AuthUI.showSignInLink()">Sign in</a>':'New here? <a href="#" onclick="event.preventDefault();AuthUI.showSignUpLink()">Create an account</a>'}</p>
    `);
  },
  showSignInLink(){this.showSignInForm('signin')},
  showSignUpLink(){this.showSignInForm('signup')},
  // Firebase's email/password provider always needs an email as the account
  // identifier - that's built into how Firebase itself works, not something
  // this app can turn off. So the username becomes a fake, fixed-domain email
  // behind the scenes (e.g. "jawad" -> "jawad@plazoid.local"), and the person
  // only ever sees a username field. Same normalization on both sign-up and
  // sign-in means the same username always maps back to the same account.
  usernameToEmail(username){
    const normalized=username.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
    return normalized+'@plazoid.local';
  },
  async submit(mode){
    const rawName=document.getElementById('authName').value.trim();
    const password=document.getElementById('authPassword').value;
    const errorEl=document.getElementById('authError');
    errorEl.textContent='';
    if(!rawName||!password){errorEl.textContent='Enter a username and password.';return}
    const email=this.usernameToEmail(rawName);
    if(!email||email==='@plazoid.local'){errorEl.textContent='Username needs at least one letter or number.';return}
    try{
      if(mode==='signup'){
        const name=filterBadWords(rawName).slice(0,24);
        const cred=await createUserWithEmailAndPassword(auth,email,password);
        await updateProfile(cred.user,{displayName:name});
        // onAuthStateChanged won't see the displayName update we just made in time,
        // so set it explicitly here too rather than waiting for a second event
        DB.setActiveUid(cred.user.uid,name);
      }else{
        await signInWithEmailAndPassword(auth,email,password);
      }
      UI.close();
      toast(mode==='signup'?'Account created':'Signed in');
      Game.refreshAvatarIfActive?.();
    }catch(e){
      errorEl.textContent=this.friendlyError(e.code,mode);
    }
  },
  friendlyError(code,mode){
    const map={
      'auth/email-already-in-use':'That username is taken - try signing in instead.',
      'auth/invalid-email':'That username has characters that won\'t work - try letters and numbers only.',
      'auth/weak-password':'Password needs to be at least 6 characters.',
      'auth/wrong-password':'Wrong password.',
      'auth/invalid-credential':'Username or password is incorrect.',
      'auth/user-not-found':'No account found with that username.',
      'auth/too-many-requests':'Too many attempts - wait a moment and try again.',
      'auth/operation-not-allowed':'Sign-in isn\'t turned on for this project yet - enable Email/Password in Firebase Console > Authentication > Sign-in method.',
      'auth/network-request-failed':'Couldn\'t reach the server - check your connection and try again.'
    };
    return map[code]||`Something went wrong${code?' ('+code+')':''}. Try again.`;
  },
  showAccountPanel(){
    const user=auth.currentUser;
    UI.modal('Account',`
      <h2>${esc(DB.user?.name||user.displayName||'Player')}</h2>
      <p class="sub">${esc(user.email)}</p>
      <button class="btn blue" onclick="UI.close();UI.avatar()">Avatar</button>
      <button class="btn" onclick="UI.close();UI.shop()">Shop</button>
      <button class="btn" onclick="UI.close();UI.settings()">Settings</button>
      <button class="btn dark" style="width:100%;margin-top:10px" onclick="AuthUI.signOut()">Sign out</button>
    `);
  },
  async signOut(){
    await signOut(auth);
    UI.close();
    toast('Signed out');
  },
  refreshMenuInfo(){
    const el=document.getElementById('menuAccountInfo');
    if(!el)return;
    if(auth?.currentUser){
      el.innerHTML=`<div class="acctRow active"><div class="acctAvatarDot" style="background:${DB.user?.avatar?.shirt||'#0aa7e8'}"></div><div class="acctInfo"><b>${esc(DB.user?.name||'Player')}</b></div><button class="btn" onclick="AuthUI.signOut()">Sign out</button></div>`;
    }else{
      el.innerHTML=`<p class="sub">Not signed in.</p>`;
    }
  }
};
</script>
